# Fixed project name: Docker otherwise names the volumes after the folder,
# so renaming the folder (A58) would start an empty database.
name: rb_errata

services:
  db:
    # Pinned by tag AND digest. The tag says what we meant (pgvector 0.8.1 on
    # Postgres 17); the digest guarantees we get the same bytes even if the
    # tag is re-pushed. This is the Datum lucide-react lesson applied to the
    # database image.
    image: pgvector/pgvector:0.8.1-pg17@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
    environment:
      POSTGRES_USER: rb_errata
      POSTGRES_PASSWORD: rb_errata
      POSTGRES_DB: rb_errata
    # 5433 on the host so it cannot collide with a locally installed Postgres
    # on 5432. Bound to localhost: this is a dev database with a known password.
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on an empty volume only. `make db-init` covers volumes
      # created before this script existed.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rb_errata -d rb_errata"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Slice 14: Arize Phoenix, the trace viewer for the agent. Only with
  # `make phoenix-up` (profile "trace"), so `make db-up` stays one container.
  # Pinned by tag and digest like the database. Bound to localhost: traces
  # hold answers and rule references, and stay on this machine.
  phoenix:
    profiles: ["trace"]
    image: arizephoenix/phoenix:version-20.27.0@sha256:4d575d1b335bfef4d8af7d321ef44551d410858a32c3f9073b6a6c4444d85b11
    ports: ["127.0.0.1:6006:6006"]
    volumes:
      - phoenix:/mnt/data
    environment:
      PHOENIX_WORKING_DIR: /mnt/data

volumes:
  pgdata:
  phoenix:
