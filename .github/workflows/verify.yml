# Slice 5b: the free layer (lint, typecheck, contract tests) on every push.
# No database, no model, no Riot text: the same `make verify` a contributor
# runs locally, so a change that only passes on one machine is caught here.
#
# Actions are pinned to commit SHAs (a tag can be moved; a SHA cannot), with
# the release each SHA was resolved from beside it. Resolved 2026-11-03 with
# `git ls-remote`, which reaches GitHub where its API did not.
name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      # --frozen: install exactly uv.lock. A resolver that picked newer
      # versions here would test code nobody runs locally.
      - run: uv sync --frozen
      - run: make verify

  # The public site must always build (A40): TypeScript, MDX and the static
  # export, from the committed data. The Python job's test_site_data already
  # fails if site/data/results.json is stale.
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build

  # Slice 17: the local app's front end must typecheck and build.
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
