- id: r-costs-and-payments-total-cost-determination
  verdict: correct
  note: ''
  question: How is a card's total cost determined?
  as_of: '2026-10-01'
  reference: 'A card''s total cost is determined in five stages, in this order:

    -

    Start with the card''s base costs, replacing them or setting them to zero as instructed. [356.1]

    -

    Add all mandatory additional costs and any optional additional costs you chose to pay. [356.2]

    -

    Add all applicable cost increases. [356.3]

    -

    Reduce the card''s cost by all applicable discounts. [356.4]

    -

    Apply any effects that modify the resulting total cost. [356.5]

    Discounts that apply to one specific part of a cost are applied before discounts that apply to the
    total cost. [356.4.d]

    If multiple discounts apply within either group, you may choose their order. [356.4.c.1] [356.4.d.1]

    Any minimum imposed by a discount applies only to that discount, so a later discount can reduce the
    cost further. [356.4.e]'
  answer: A card's total cost is determined by first applying base cost modifications in any order, including
    replacing base costs when a card is played "for [Cost]" or setting specific costs to zero when "ignoring"
    a cost is allowed, with the understanding that additional costs or increases may still result in a
    positive total cost [core@1.4:356.1]. After base cost modifications, any other cost increases or decreases
    are applied in any order [core@1.4:356.5]. Effects that determine a card’s cost for any purpose use
    its printed or copied cost, even if modified, unless otherwise specified [core@1.4:206.1]. Additionally,
    effects that determine an ability’s cost use its base cost, ignoring alterations unless specified
    to include modifications [core@1.4:206.1]. Thus, the total cost is derived through a sequence of base
    cost adjustments followed by additional cost modifications, with the printed or copied cost serving
    as the reference point for cost-related effects. [core@1.4:356.1][core@1.4:356.5][core@1.4:206.1]
