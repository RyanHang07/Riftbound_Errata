- id: r-baited-hook-karthus-deathknell-timing
  verdict: correct
  note: ''
  question: If Baited Hook kills Glasc Mixologist and plays Karthus, Eternal, does Glasc Mixologist's
    Deathknell trigger twice?
  as_of: '2026-10-01'
  reference: 'No.

    Baited Hook kills Glasc Mixologist before it plays Karthus, Eternal.

    Glasc''s Deathknell triggers before he enters the trash. [808.1.d.2]

    Karthus''s passive ability is active only while he is on the board. [365.1]

    Karthus entering later does not reevaluate Glasc''s earlier death or make the Deathknell trigger again.
    [383.2.c]

    Glasc''s Deathknell can play only one unit from the trash.'
  answer: 'No, Glasc Mixologist''s Deathknell does not trigger twice.


    Deathknell is a triggered ability that activates when a permanent is killed and sent to the trash
    [core@1.4:808.1]. The trigger occurs only once per instance of the permanent being killed and sent
    to the trash, regardless of how many abilities or effects are involved in the process [core@1.4:808.1.d.1].
    The rule specifies that the trigger is added to the chain as a Pending Item when the permanent is
    being [quoted text from core@1.4:808.1 removed] [core@1.4:808.1.d.2], and it is only processed once,
    based on the permanent''s death event.


    In this scenario, Baited Hook kills Glasc Mixologist (a Kill Instruction), and then Karthus, Eternal
    is played. The Deathknell effect triggers only once—when Glasc Mixologist is killed and sent to the
    trash—because the death event is a single event, and Deathknell is not designed to trigger multiple
    times per death. The playing of Karthus, Eternal does not cause a second death or re-trigger the Deathknell
    effect.


    Therefore, Glasc Mixologist''s Deathknell triggers only once, not twice.


    [core@1.4:808.1.d.1] [core@1.4:428.1.a.1.b] [core@1.4:323.4]'
