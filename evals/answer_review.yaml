  question: When do I pay costs in a triggered ability?
  as_of: '2026-10-01'
  reference: 'The "[do X] to [do Y]" form creates a cost within instructions: [do X] is the cost and [do
    Y] is its effect. [740.4.a]

    Pay [do X] during finalization if it begins the triggered effect or immediately follows an initial
    "you may." [383.3.b] [383.3.b.1] [740.4.a.2]

    Pay it during resolution if it appears later. [740.4.a.2.a]

    If that cost is due during finalization and you decline to pay it, the pending ability is removed
    from the chain without finalizing. [404.2]

    The "[do X]. If you do, [do Y]" form does not create a cost within instructions.

    The [do X] instruction is executed during resolution. [406.5]

    For example, Vayne, Hunter says "When I conquer, you may pay [1] to return me to my owner''s hand."

    The "pay [1] to return me" form creates a cost within instructions immediately after the initial "you
    may," so you pay it during finalization.

    If you pay, the ability finalizes and opponents may react before it resolves. [406.4]

    By contrast, Insightful Investigator first has an opponent reveal their hand and only then offers
    a payment, so that cost within instructions appears later and you pay it during resolution.'
  answer: 'When do I pay costs in a triggered ability?


    For triggered abilities, costs within instructions are paid at different times depending on their
    placement in the effect:


    - If the cost appears as the first part of the trigger effect (i.e., at the beginning of the effect),
    it [quoted text from core@1.4:383.3 removed] and must be paid to finalize the ability and place it
    on the Chain. This payment occurs during the finalization of the triggered ability [core@1.4:383.3.b],
    [core@1.4:204.3.a], and [core@1.4:740.4.a.2.a].


    - If the cost appears in any later part of the trigger effect (i.e., not in the first part), it is
    paid on resolution of the ability, not during finalization [core@1.4:204.3.b] and [core@1.4:740.4.a.2.a].


    Additionally, players may choose to decline to pay such costs at any time during the resolution phase,
    which causes the ability to be removed from the Chain and cease being a Pending Item, without being
    countered [core@1.4:404.2].


    Thus, the timing of cost payment in a triggered ability depends on where the cost appears in the ability''s
    text: at the beginning of the effect (paid upon finalization) or in a later part (paid upon resolution).'
