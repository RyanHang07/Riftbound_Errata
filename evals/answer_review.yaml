- id: v-legion-countered-spell-v1.2
  verdict: correct
  note: ''
  question: If my spell gets countered, does it still count as having played a card this turn for Legion?
  as_of: '2026-02-04'
  reference: 'Up to v1.2 Legion was satisfied by its controller playing another card (728.2 / 738.2),
    and a countered card was not played, including for abilities that check whether cards were played
    (406.4, 406.4.b). v1.3 rewrote Legion to check whether another card was Finalized, Riot''s Unleashed
    FAQ confirmed that a countered spell still turns Legion on, and v1.4 wrote that into 419.4.b with
    the Defy example. Old answer (v1.1-1.2): no. Answer since v1.3: yes.


    This question is dated 2026-02-04, so the right answer is the OLD answer described above.'
  answer: No, if my spell gets countered, it does not count as having played a card this turn for Legion.
    Countering a card negates its execution and does not count as a play, meaning the card is not considered
    to have been played [core@1.2:412.1]. Since Legion's condition depends on having played a Main Deck
    card this turn [core@1.2:738.1.c.2], and a countered card is not considered played, the Legion condition
    will not be satisfied by that card. Therefore, the spell does not count as having been played for
    the purpose of triggering Legion effects.
- id: v-no-result-staging-v1.3
  verdict: correct
  note: ''
  question: If a combat ends with No Result and both players still have units there, what gets staged
    at that battlefield?
  as_of: '2026-05-27'
  reference: 'In v1.3 a combat was staged. v1.4 stages a showdown and a combat. (The rule has no counterpart
    before v1.3.)


    This question is dated 2026-05-27, so the right answer is the OLD answer described above.'
  answer: If a combat ends with "No Result" and both players still have units there, a Combat is staged
    at that battlefield [core@1.3:461.3.d.1]. This is because "No Result" occurs when either both players
    have units present or neither does, and [quoted text from core@1.3:461.3 removed] [core@1.3:461.3.d.1].
    This staged combat remains active as long as there are units from opposing players present at the
    battlefield [core@1.3:323.9.a].
