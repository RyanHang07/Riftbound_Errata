- id: r-bone-skewer-optional-additional-costs
  verdict: correct
  note: ''
  question: Can a unit played for free by Bone Skewer still get an effect for paying an optional additional
    cost?
  as_of: '2026-10-01'
  reference: 'Yes.

    The phrase "any and all costs" in Bone Skewer''s text is broader than the standard "ignoring its cost"
    wording.

    Standard cost-ignoring only zeroes out a card''s base energy and power costs. [356.1.b.1]

    -

    The opponent chooses whether to pay an optional additional cost while making the relevant choices
    for the unit. [355.1.a]

    -

    A chosen additional cost is included when determining the unit''s total cost, which Bone Skewer then
    sets to zero. [356.2] [356.5.a]

    -

    The optional additional cost counts as paid based on that decision, regardless of the amount actually
    spent. [356.4.f.1]

    Note (Example):

    You play Bone Skewer and choose Nami, Headstrong from your opponent''s hand.

    Your opponent chooses to pay Nami''s optional additional cost of Calm, and Bone Skewer sets the resulting
    total cost to zero.

    When Nami completes being played, her play effect triggers because the additional cost counts as paid,
    allowing your opponent to stun an enemy unit. [419.4.a]'
  answer: 'Yes, a unit played for free by Bone Skewer can still get an effect for paying an optional additional
    cost, provided that the optional additional cost is not inherently tied to the unit''s base cost or
    the mechanism of Bone Skewer''s effect.


    Bone Skewer allows a unit to be played for free, which means the player does not pay the unit''s normal
    cost. However, the rules do not state that playing a unit for free nullifies or removes any optional
    additional costs associated with that unit. Instead, optional additional costs are defined as non-mandatory
    costs that the player may choose to pay, and such choices are made during step 2 of the card play
    process [core@1.4:356.2.b.1]. These costs are independent of whether the base cost of the unit is
    paid or not.


    For example, if a unit has a passive ability that says "[quoted text from core@1.4:356.2 removed]],"
    then even if the unit is played for free (e.g., via Bone Skewer), the player can still choose to pay
    that optional additional cost, and if they do, the effect (such as reducing the cost by [2]) would
    still apply [core@1.4:356.2.b.1].


    Moreover, the rules clarify that optional additional costs are not mandatory and are only paid if
    the player chooses to do so [core@1.4:356.2.b.1]. Therefore, even if the base cost is waived, the
    player retains the option to pay such costs, and any effects tied to paying them are still triggered
    if the cost is paid.


    Thus, the effect of paying an optional additional cost is not invalidated by the unit being played
    for free.


    [core@1.4:356.2.b.1]'
