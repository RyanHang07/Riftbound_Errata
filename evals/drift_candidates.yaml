- id: rune-pool-empties
  question: "When does my Rune Pool empty during my turn?"
  as_of: 2026-10-01
  current: ["core@1.4:167"]
  stale: ["core@1.1:160", "core@1.2:163", "core@1.3:166"]
  change: >-
    Until v1.4 the Rune Pool emptied at the end of each player's draw phase
    (and at end of turn). v1.4 moves the first emptying to the start of each
    player's Main Phase.

- id: replacement-effect-order
  question: "When two replacement effects apply to the same event on a unit, who decides the order they apply in?"
  as_of: 2026-10-01
  current: ["core@1.4:372"]
  stale: ["core@1.1:368", "core@1.2:368", "core@1.3:372"]
  change: >-
    Until v1.4 the owner of the affected object ordered the replacement
    effects. v1.4 gives that choice to its controller. The answers differ
    whenever control has changed hands.

- id: accelerate-two-domains
  question: "For a unit with two domains, can I pay the power part of its Accelerate cost with power of any domain?"
  as_of: 2026-10-01
  current: ["core@1.4:805.1.a.2"]
  stale: ["core@1.1:721.1.a.2", "core@1.2:731.1.a.2", "core@1.3:805.1.a.2"]
  change: >-
    Until v1.4 a unit with no domain or with more than one domain could pay
    Accelerate's power with power of any domain. v1.4 keeps that only for a
    unit with no domain. Old answer: yes. Current: no.

- id: legend-leave-zone
  question: "Can my Champion Legend ever leave the Legend Zone during a game?"
  as_of: 2026-10-01
  current: ["core@1.4:133.6.b.1"]
  stale: ["core@1.1:132.6.b.1", "core@1.2:132.6.b.1", "core@1.3:133.6.b.1"]
  change: >-
    Until v1.4 legends could not leave the Legend Zone during play. v1.4 says
    they cannot typically leave it. Old answer: never. Current: not normally.

- id: countered-spell-played
  question: "Does a countered spell still count as a card I played?"
  as_of: 2026-10-01
  current: ["core@1.4:425.1.b"]
  stale: ["core@1.1:412.1.b", "core@1.2:412.1.b", "core@1.3:425.1.b"]
  change: >-
    Until v1.4 a countered card was not considered played at all. v1.4 limits
    that to abilities that trigger on cards being played. Old answer: no.
    Current: it is not played for play-triggers only.

- id: c-cost-two-domains
  question: "On a card with two domains, how is a [C] in its cost paid?"
  as_of: 2026-10-01
  current: ["core@1.4:135.2.e.6.b"]
  stale: ["core@1.1:134.2.e.6.b", "core@1.2:134.2.e.6.b", "core@1.3:135.2.e.6.b"]
  change: >-
    Until v1.4 a [C] on a card with no domain or several domains was treated
    as [A], a power of any domain. v1.4 keeps that only for cards with no
    domain.
