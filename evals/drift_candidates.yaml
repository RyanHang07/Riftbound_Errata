# Slice 3 drift candidates: rules whose MEANING changed, found with the
# alignment diff (rb_errata/ingest/align.py) and chosen by reading the changes,
# before any search was run.
#
# Refs are version-qualified (A16). `stale` lists every version whose text
# gives the old answer; `current` the text in effect on `as_of`. A version
# whose wording differs but whose meaning matches today's rule is in neither,
# so ranking it first is "inconclusive", never "captured".
#
# `change` is written in our words. It quotes no rule text beyond keywords.
#
# PREDICTION, written 2026-10-01 before the first real run (brief section 2:
# predicting afterwards is how a null result becomes a success story):
#   1 or 2 of the 4 captured. A miss is plausible for each one, because the
#   current and stale chunks share most of their wording, so their vectors sit
#   close together and small differences decide the order.
#   legion-countered-spell is the LEAST likely capture: only the v1.4 chunk
#   mentions Legion by name (in its new example), which should pull it up.
#   deflect-chosen-twice is the MOST likely: the stale text says "choose me",
#   echoing the question's "chooses my ... unit", while v1.4 says "target".
#
# OUTCOME of the first run (2026-10-01, evals/fixtures/drift-2026-10-01/):
#   graded 1 captured (deflect). Re-graded after correcting a wrong label:
#   0 captured, 1 not captured, 3 inconclusive. The prediction was wrong.

- id: legion-countered-spell
  question: "If my spell gets countered, does it still count as having played a card this turn for Legion?"
  as_of: 2026-10-01
  current: ["core@1.4:419.4.a.1", "core@1.4:419.4.b"]
  stale: ["core@1.1:406.4.b", "core@1.2:406.4.b", "core@1.3:419.4.b"]
  change: >-
    Up to v1.3 the rules said a countered card was not played at all. v1.4
    keeps that play-triggers do not fire, but adds that checks of whether a
    card was played look at whether it was Finalized, with the example that a
    spell countered by Defy still turns on Legion. Old answer: no. Current: yes.

- id: deflect-chosen-twice
  question: "If an enemy spell chooses my Deflect unit twice, does it have to pay the Deflect cost twice?"
  as_of: 2026-10-01
  current: ["core@1.4:809.1.c"]
  stale: ["core@1.1:725.1.c", "core@1.2:735.1.c"]
  # core@1.3:809.1.c is neither: it already says "for each time they choose me".
  #
  # WRONG, as first written (left visible; brief section 10):
  #   stale: [..., "core@1.3:809.1.c"]
  #   change: "Up to v1.3 Deflect added its cost once ..."
  # The first real run graded this candidate "captured" because v1.3 ranked
  # first. Reading the evidence showed v1.3 already gives today's answer: the
  # per-choice wording arrived in v1.3, and v1.4 changed "choose" to "target".
  # Cause: the cross-version trace printed rule texts cut at 140 characters,
  # and the deciding words start at character 170. Fix: `make check-candidates`
  # prints full texts, and every candidate is verified with it.
  change: >-
    Up to v1.2 Deflect added its cost once to an enemy spell or ability that
    chose the unit. v1.3 made it apply for each time the unit is chosen, and
    v1.4 kept that while changing "choose" to "target". Old answer (v1.1-1.2):
    once. Answer since v1.3: once per choice, so twice.

- id: teammate-spells-2v2
  question: "In 2v2, can my teammate play spells during my turn whenever they want?"
  as_of: 2026-10-01
  current: ["core@1.4:316.5.b.1"]
  stale: ["core@1.1:316.2.b.1", "core@1.2:316.2.b.1"]
  # core@1.3:316.2.b.1 already says the same as v1.4: neither stale nor current.
  change: >-
    Up to v1.2 the turn player's teammates could play spells and abilities on
    the turn player's turn. From v1.3 they may do so only when the turn player
    invites them with their own priority. Old answer: yes. Current: only when
    invited.

- id: gear-to-battlefield
  question: "Can an effect play a gear directly to a battlefield?"
  as_of: 2026-10-01
  current: ["core@1.4:152.2"]
  stale: ["core@1.3:151.2"]
  change: >-
    In v1.3 gear was always played to base, with playing it from facedown as
    the only exception. v1.4 says gear is played to base unless an effect says
    otherwise. Old answer: no. Current: yes, if the effect says so.

# ---------------------------------------------------------------------------
# BATCH 2 (added 2026-10-01 after the first run). Every rule here changed ONLY
# in v1.4, so v1.1, v1.2 and v1.3 are three identical stale copies competing
# with one current copy. Each was verified with full rule texts before any
# search ran (`make check-candidates`).
#
# PREDICTION for batch 2, written before running it:
#   2 to 4 of these 6 captured. Reasoning: when the edit is small, the four
#   copies embed almost identically, so the top spot is close to a draw that
#   the three stale copies win three times in four; but batch 1 showed the
#   right rule can also be missed entirely, which caps the count.
#   accelerate-two-domains and c-cost-two-domains are the likeliest misses:
#   their questions use game shorthand ("[C]", "power") that may match many
#   cost rules better than the specific one.
#
# OUTCOME (2026-10-01, evals/fixtures/drift-2026-10-01T1906Z/): 3 of 6
#   captured (rune-pool, replacement-order, accelerate), inside the predicted
