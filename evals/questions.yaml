- id: r-chain-and-priority-unit-play-reactions
  question: Can I react to units being played?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:337.1.a
  - core@1.4:337.2
  - core@1.4:359.2.c
  - core@1.4:357.1.a
  - core@1.4:444.2.c
  - core@1.4:383.2.c
  - core@1.4:383.3
  - core@1.4:383.4.a.2
  - core@1.4:337.4
  - core@1.4:338.1.a
  - core@1.4:338.1.a.2
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: general-rules
  answer_short: other
  answer: 'You cannot react to another player''s unit before it enters the board.

    Finalizing the unit does not pass priority; the unit instead resolves immediately and enters the board.
    [337.1.a] [337.2] [359.2.c]

    The unit''s controller has one exception: while paying the unit''s costs, they may activate an ability
    with Reaction that uses Add. [357.1.a]

    That ability finalizes and resolves immediately during payment. [444.2.c]

    After the unit enters, its play effect and any other fulfilled triggered abilities are put on the
    chain. [383.2.c] [383.3] [383.4.a.2]

    You may react once those abilities finalize and priority is granted, but the unit is already on the
    board by then. [337.4] [338.1.a] [338.1.a.2]'
