- id: r-abilities-trigger-time-conditions
  question: When does the game check an "if" condition in a triggered ability?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:383.2.a
  - core@1.4:383.2.a.1
  - core@1.4:383.2.c
  - core@1.4:383.3
  - core@1.4:383.2.b
  - core@1.4:359.3.d
  - core@1.4:406.5
  version_dependent: null
  stale_text_exists: false
  provenance: mined
  stratum: expert-ruling
  category: general-rules
  answer_short: other
  answer: 'An "if" condition immediately after the trigger condition is checked after the triggering event,
    while one after an effect instruction is checked during resolution.

    - **Immediately after the trigger condition:** A trigger condition begins with "When," "At," or "The
    [Nth] time," and an additional conditional statement immediately following it is part of that condition.
    [383.2.a] [383.2.a.1]

    The game checks those requirements after the triggering event has been processed. [383.2.c]

    If they are not satisfied then, the ability is not placed on the chain. [383.3]

    For example, Gutter Palace checks the hand and battlefield quantities in its "if" condition at the
    start of the Beginning Phase; if either is wrong then, its ability is not placed on the chain.

    - **After an effect instruction:** The "if" condition is part of the effect, so the ability is placed
    on the chain and checks that condition when it resolves. [383.2.b] [359.3.d] [406.5]

    For example, Loose Cannon first instructs its controller to draw 1 and then checks hand size, so its
    ability is placed on the chain at the start of every Beginning Phase and checks the "if" condition
    during resolution.'
  cited_rule_history:
    383.2.a: new-in-1.4
    383.2.a.1: new-in-1.4
    383.2.c: stable
    '383.3': stable
    383.2.b: new-in-1.4
    359.3.d: stable
    '406.5': stable
  source:
    url: https://github.com/ChristianIvicevic/riftboundfaq/blob/816d3b32d32a9966fc73367efb690fcbb4c195ca/content/(rulings)/general-rules/abilities.mdx#trigger-time-conditions
