- id: r-targeting-target-definition
  question: What makes something a target?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:355.10
  - core@1.4:355.9.a
  - core@1.4:355.10.a
  - core@1.4:355.10.b
  - core@1.4:355.10.c
  - core@1.4:355.10.c.1
  - core@1.4:355.10.d
  - core@1.4:355.10.d.1
  - core@1.4:355.10.d.2
  - core@1.4:355.10.e
  - core@1.4:355.10.f
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: general-rules
  answer_short: other
  answer: 'Unless one of the exceptions below applies, a game object, player, or zone mentioned by a spell,
    activated ability, or triggered ability is a target. [355.10]

    Card text does not need to say "target" or "choose"; for example, "Kill a unit" targets a unit. [355.9.a]

    The only exceptions are:

    - **Objects in non-public zones:**

    An object in a non-public zone is not a target. [355.10.a]

    For example, "You may play a unit from your hand" does not target a card in hand.

    - **Restrictions or permissions for another choice or action:**

    Something mentioned only as a targeting restriction, or as a restriction or permission for another
    game action, is not a target. [355.10.b]

    "Kill a unit at a battlefield" targets the unit but not the battlefield, while "Play a unit from your
    hand to a battlefield" does not target the battlefield.

    - **Objects used only in costs, trigger conditions, or replacement effects:**

    Something included only as part of a cost, trigger condition, or replacement effect is not a target.
    [355.10.c] [355.10.c.1]

    The dying unit in "When a friendly unit dies, kill a gear" is not a target, but the gear is.

    - **Objects determined without a choice:**

    An object identified from its characteristics without that controller choosing it is not a target
    when no choice is ever possible. [355.10.d] [355.10.d.1]

    "Ready your legend" does not target your legend because you can have only one.

    In "Kill all units at a battlefield," the units are not targets, but the battlefield is.

    An instruction to "Kill a unit at a battlefield" still targets a unit when only one is legal. [355.10.d.2]

    - **Sets chosen by other players:**

    An object in a set chosen wholly or partly by other players is not a target. [355.10.e]

    "Each player kills a unit they control" targets nothing.

    - **Objects identified by "must" instructions:**

    An object identified by that instruction is not a target, even if the player chooses which object
    satisfies it. [355.10.f]

    "You must recycle one of your runes" does not target, while "Recycle a rune you control" does.'
  cited_rule_history:
