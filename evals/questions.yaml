  - core@1.4:383.4.a
  - core@1.4:383.4.a.2
  - core@1.4:317.1.a
  - core@1.4:317.2.a
  - core@1.4:317.2.b
  - core@1.4:383.1
  - core@1.4:337.4
  - core@1.4:338.1.a.2
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: other
  answer: 'Damage still marked by Elder Dragon''s controller becomes lethal to enemy units when Elder
    Dragon enters, and opponents cannot react after it enters before the resulting cleanup handles that
    lethal damage.

    Elder Dragon''s "your damage" means damage marked by its controller. [142.3.b]

    Its first ability is a passive statement that changes the lethal-damage value for those enemy units
    while Elder Dragon is on the board. [142.4.c] [364.2] [365.1]

    Finalizing a unit does not pass priority, and the unit resolves immediately. [337.1.a] [337.2]

    After Elder Dragon enters, a cleanup happens without passing or awarding priority, and every unit
    with lethal damage is killed unless that death is replaced. [319.6] [320.1] [323.5] [370.1] [370.1.c]

    Elder Dragon''s separate "When you play me" ability is a triggered play effect, but it does not create
    a response window before this lethal-damage check. [383.4.a] [383.4.a.2]

    Note (Example):

    You play Flurry of Blades during your turn, and its 1 damage remains marked on enemy units at battlefields.

    When you later play Elder Dragon directly, each of those units is killed in the cleanup caused by
    Elder Dragon entering before your opponents can react.

    The same result occurs if Dazzling Aurora plays Elder Dragon at the end of your turn.

    End-of-turn abilities happen in the Ending Step, before the Expiration Step''s special cleanup heals
    all units, so reaching the end of the turn has not itself healed Flurry of Blades'' damage yet. [317.1.a]
    [317.2.a] [317.2.b]

    Opponents may react while Dazzling Aurora''s triggered ability waits to resolve. [383.1] [337.4] [338.1.a.2]

    Once that ability begins resolving and reveals Elder Dragon, no new priority window opens before Elder
    Dragon enters and the affected units are killed.'
