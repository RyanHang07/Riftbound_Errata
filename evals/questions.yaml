  stratum: expert-ruling
  category: cards
  answer_short: other
  answer: 'Yes, if you play Elder Dragon while an enemy unit at a battlefield has your damage marked on
    it and that unit''s controller controls Zhonya''s Hourglass in their base: Zhonya''s Hourglass replaces
    that unit''s death and recalls it before you choose targets for Elder Dragon''s play effect, so you
    can choose the recalled unit in its controller''s base.

    If another valid enemy unit remains at a battlefield, you can choose that unit as well because it
    is at a different location.

    -

    Elder Dragon enters, and its passive makes your marked damage lethal to the damaged enemy unit. [142.4.c]

    Its play effect is then added to the chain as a pending item. [383.4.a.2]

    -

    Both Elder Dragon entering and its play effect being added require cleanup before play continues.
    [319.6] [319.3]

    All outstanding cleanups finish before the pending effect can begin finalization. [320] [334.2]

    -

    During cleanup, the damaged unit would be killed. [323.5]

    Zhonya''s Hourglass replaces that death: the Hourglass is killed instead, and the unit is healed,
    exhausted, and recalled to its controller''s base rather than killed. [370.1.a.1]

    -

    Killing Zhonya''s Hourglass sends it from the board to the trash, making another cleanup outstanding
    after the current one. [428.1] [319.6] [322]

    -

    After all cleanups finish, you choose targets while finalizing the play effect. [334.2] [337.1] [191.4.c]
    [402.2]

    The recalled unit is now in base, and any valid enemy unit that remains at a battlefield is at a different
    location, so both can be chosen. [146.1] [198.1] [355.11.a]

    When the effect resolves, it deals 1 to each target it affects, marking damage on each unit separately.
    [417.1.b] [417.1.c]

    If Elder Dragon remains on the board, its passive makes that damage lethal, so each affected unit
    would be killed during the cleanup after the ability leaves the chain. [142.3.b] [142.4.c] [365.1]
    [406.5] [319.5] [323.5]'
