- id: r-lilting-lullaby-own-counter
  question: If my opponent targets my spell with Lilting Lullaby and I counter my own spell in response,
    can I still play spells?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:425.1.a
  - core@1.4:355.9.a.2
  - core@1.4:359.3.e.2
  - core@1.4:359.3.e.1
  - core@1.4:359.3.e.5
  - core@1.4:359.3.e.14
  - core@1.4:359.3.e.14.a
  version_dependent: null
  stale_text_exists: false
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: 'yes'
  answer: 'Yes.

    Countering your spell clears it from the chain, so it is an illegal target when Lilting Lullaby resolves.
    [425.1.a] [355.9.a.2] [359.3.e.2]

    Lilting Lullaby still resolves, but its counter instruction is ignored because the target is illegal.
    [359.3.e.1] [359.3.e.5]

    The spell-play restriction is linked to that ignored instruction through "its controller," so the
    restriction is also ignored. [359.3.e.14] [359.3.e.14.a]'
