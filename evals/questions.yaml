- id: r-diana-lunari-ability-finalization-cost
  question: When do I pay the 1 energy for Diana, Lunari's ability?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:406.4
  - core@1.4:383.3.a
  - core@1.4:383.3.b
  - core@1.4:383.3.b.1
  - core@1.4:740.4.a
  - core@1.4:444.2.c
  - core@1.4:404.2
  - core@1.4:406.2
  - core@1.4:444.2
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: other
  answer: 'You pay it while Diana''s triggered ability is being finalized, before opponents receive the
    normal opportunity to play Reactions to the ability. [406.4]

    Because "you may" is the first part of the effect, you choose whether to perform the ability during
    finalization. [383.3.a]

    The immediately following "pay [1] to Predict" is a cost within instructions, so the payment becomes
    the triggered ability''s base cost and must be paid for the ability to finalize. [383.3.b] [383.3.b.1]
    [740.4.a]

    While paying, you may activate an eligible Add ability with Reaction to provide the energy. [444.2.c]

    If you decline to pay, the pending ability is removed from the chain without finalizing. [404.2]

    If you pay, it becomes a finalized chain item, and opponents may react before it resolves. [406.2]
    [406.4]

    When it resolves, you Predict, reveal the top card of your main deck, and draw that card if it is
    a spell.

    Note (Errata):

    Diana received functional errata.

    Older printings say "you may pay [1]. If you do, ..."; her current text says "you may pay [1] to ..."
    instead.

    This changes the payment from an instruction performed during resolution into a cost paid while finalizing
    the ability.

    CR 444.2 still describes Diana using her pre-errata behavior and incorrectly places the payment during
