- id: r-elder-dragon-lethal-damage-timing
  question: Does damage from earlier in the turn become lethal when Elder Dragon enters, and can I react?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:142.3.b
  - core@1.4:142.4.c
