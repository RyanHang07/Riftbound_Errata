- id: r-shady-spectacles-copying-temporary
  question: Does a Reflection token with Temporary lose Temporary after Shady Spectacles makes it a copy
    of a unit that doesn't have Temporary?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:477.1.b
  - core@1.4:477.1.b.1
  - core@1.4:477.1.b.1.a
  - core@1.4:477.2.a
  - core@1.4:801.3.a.3
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: other
  answer: 'It depends on where Temporary came from.

    The Reflection token keeps Temporary if a separate effect granted it, but loses the keyword if it
    had Temporary only in rules text copied from another unit.

    Shady Spectacles replaces the token''s copyable traits, the characteristics inherited through a copy
    effect, including its rules text. [477.1.b] [477.1.b.1] [477.1.b.1.a]

    The separate keyword grant applies afterward in the ability-altering layer. [477.2.a]

    Because the grant has no stated duration, it continues for as long as the token remains on the board.
    [801.3.a.3]'
  cited_rule_history:
