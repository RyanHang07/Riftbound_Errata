- id: r-azir-sovereign-attack-trigger-without-azir
  question: If Azir, Sovereign is killed or returned to his base before his attack trigger resolves, do
    token units still move?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:406.2
  - core@1.4:406.5
  - core@1.4:359.3.f.1
  - core@1.4:359.3.f.2
  - core@1.4:359.3.e.12
  - core@1.4:455
  - core@1.4:124
  - core@1.4:428.2
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: other
  answer: 'If Azir is killed, no token units move; if he is returned to base, no token units move unless
    he returns to a battlefield before the move instruction executes.

    Removing Azir does not by itself stop the triggered ability from resolving. [406.2] [406.5]

    "This battlefield" refers to information drawn from Azir as the ability''s source, and the game checks
    that information when the instruction executes. [359.3.f.1] [359.3.f.2]

    If Azir is at base or no longer on the board then, he has no battlefield for the instruction to use.
    [359.3.e.12]

    Without a battlefield to use, no token units move.

    A recalled Azir remains the same permanent on the board, so returning him to a battlefield before
    execution supplies a battlefield for the instruction. [455] [124]

    A killed Azir moves from the board to the trash. [428.2]

    That card becomes a new object for tracking. [124]

    Returning it to the board therefore does not restore the source tracked by the ability.'
