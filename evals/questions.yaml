- id: r-gangplank-naval-partial-resolution
  question: If Gangplank, Naval replaces one part of a spell or ability, does the rest still resolve?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:359.3.e.14.b
  - core@1.4:370.1
  - core@1.4:370.1.b
  version_dependent: null
  stale_text_exists: false
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: other
  answer: 'Yes, only the qualifying stun, might decrease, or return-to-hand event is replaced; the spell
    or ability''s other instructions continue unless a later linked instruction specifically requires
    the replaced action to have occurred. [359.3.e.14.b]

    A replacement effect only replaces the specific event or instruction that qualifies for it. [370.1]
    [370.1.b]

    Note (Example):

    You play Star-Crossed, targeting your own Empowered Gangplank as the friendly unit and an opponent''s
    Elder Dragon as the enemy unit.

    The return event affecting Elder Dragon would not return Gangplank, so his replacement effect does
    not apply to it; Elder Dragon is returned to hand normally.

    Returning Gangplank is the qualifying event: instead of going to hand, he gets +3 might.

    The rest of Star-Crossed resolves normally; it simply produces a different result for the one return
    event involving Gangplank.'
  cited_rule_history:
    359.3.e.14.b: new-in-1.4
    '370.1': stable
    370.1.b: stable
  source:
    url: https://github.com/ChristianIvicevic/riftboundfaq/blob/816d3b32d32a9966fc73367efb690fcbb4c195ca/content/(rulings)/cards/gangplank-naval.mdx#partial-resolution
    authors:
