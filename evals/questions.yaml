- id: r-playing-cards-play-definition
  question: What does "play" mean on a card?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:354
  - core@1.4:354.2
  - core@1.4:419.3
  - core@1.4:419.3.b
  - core@1.4:811.1.c.1
  - core@1.4:419.4.b
  - core@1.4:812.1.b.1
  - core@1.4:812.1.c
  - core@1.4:419.4.a
  - core@1.4:337.2
  - core@1.4:337.4
  - core@1.4:339.1
  - core@1.4:419.4.a.1
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: general-rules
  answer_short: other
  answer: '"Play" has three meanings in rules text: starting the play process, a non-triggered check counts
    a card when it finalizes, and a trigger condition counts it only when it resolves.

    - **Starting play — "play a card."** A play starts by moving the card to the chain as a pending item.
    [354] [354.2]

    If a game effect gives the instruction during resolution, as on Here to Help or Fizz, Trickster, the
    card follows every normal play step unless the effect says otherwise. [419.3] [419.3.b]

    Hiding is a separate action, so it does not satisfy an instruction to play a card. [811.1.c.1]

    - **Non-triggered check — "if you''ve played."** This checks whether the card finalized, not whether
    it resolved. [419.4.b]

    A finalized spell still counts if it is later countered.

    This is the meaning used by Battering Ram, Crescent Guardian, Back Off, and Legion. [812.1.b.1] [812.1.c]

    - **Trigger condition — "when you play."** This waits for the card''s resolution to complete. [419.4.a]

    Units and gear resolve immediately after finalizing, but a spell resolves only after players receive
    priority and all pass without adding another item. [337.2] [337.4] [339.1]

    A countered card does not fulfill this trigger condition because it does not resolve. [419.4.a.1]

    This is the meaning used by Ravenbloom Student and Darius, Trifarian.'
  cited_rule_history:
