- id: r-empower-removed-source-trigger
  question: Does a "When I become Empowered" ability trigger if the unit leaves the board before its Empower
    ability resolves?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:441.2
  - core@1.4:828.1.d
  - core@1.4:406.2
  - core@1.4:425.1
  - core@1.4:425.2.a
  - core@1.4:340.1
  - core@1.4:406.5
  - core@1.4:827.1.c.1
  - core@1.4:384.2
  - core@1.4:124
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: mechanics
  answer_short: 'no'
  answer: 'No.

    If the unit leaves the board before its Empower ability resolves, it does not become Empowered, so
    its "When I become Empowered" ability does not trigger. [441.2] [828.1.d]

    Removing the unit does not counter its already-finalized Empower ability, so that ability remains
    on the chain. [406.2] [425.1] [425.2.a]

    Note (Example):

    You activate Mel, Defiant Soul''s Empower ability and discard a spell to pay its cost.

    Your opponent responds with Star-Crossed, returning Mel and one of their own units, each to its owner''s
    hand.

    Star-Crossed resolves first, so Mel leaves the board while her Empower ability remains on the chain.
    [340.1]

    Mel''s Empower ability then resolves, but Mel cannot become Empowered while she is off the board,
    so her banish ability does not trigger.

    When the Empower ability resolves, it tries to empower the unit whose ability was activated. [406.5]
    [827.1.c.1]

    Only a game object on the board can become Empowered.

    While the original unit is off the board, it cannot become Empowered or evaluate its triggered ability''s
    condition. [384.2]

    If the card returns from a non-board zone before the Empower ability resolves, the returned card is
    a new object rather than the original unit. [124]'
  cited_rule_history:
    '441.2': new-in-1.4
    828.1.d: new-in-1.4
    '406.2': new-in-1.4
