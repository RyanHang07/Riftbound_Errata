- id: r-empower-empower-other-objects
  question: Can a unit or gear without an Empower or Empowered ability become Empowered?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:441.3.a
  - core@1.4:441.2
  - core@1.4:441.1.b
  - core@1.4:441.1.c.1
  version_dependent: null
  stale_text_exists: false
  provenance: mined
  stratum: expert-ruling
  category: mechanics
  answer_short: 'yes'
  answer: 'Yes.

    A unit or gear does not need a printed Empower or Empowered ability to become Empowered.

    You can empower an object only when a game effect instructs you to do so. [441.3.a]

    The Empowered state can apply to any game object on the board. [441.2]

    Normally, an object that is already Empowered cannot become Empowered again. [441.1.b]

    An effect can permit an already Empowered object to be empowered again, subject to the limits of that
    effect. [441.1.c.1]

    Note (Example):

    Sanction can empower an unempowered legal unit and Hextech Formula can empower another gear; neither
    object needs a printed reference to Empower or Empowered.'
  cited_rule_history:
