- id: r-endless-riches-recycle-destination
  question: Where does a spell played by Fizz, Trickster or Kai'Sa, Evolutionary go while Endless Riches
    is in play?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:416.1
  - core@1.4:416.1.a
  - core@1.4:416.1.c
  - core@1.4:390.3.a
  - core@1.4:369.1
  - core@1.4:372
  - core@1.4:370.2
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: other
  answer: 'Ordinarily, it is recycled to the bottom of its owner''s main deck. [416.1] [416.1.a] [416.1.c]

    The "then recycle it" text on Fizz, Trickster and Kai''Sa, Evolutionary creates a delayed replacement
    effect for a finalized spell leaving the chain other than through its own effect. [390.3.a]

    Endless Riches creates another replacement effect that would replace the spell going to the trash
    with banishing it. [369.1]

    When both replacement effects apply to a spell that would go to the trash, the spell''s controller
    chooses the order in which to apply them. [372]

    Either order recycles the spell.

    - **Fizz or Kai''Sa first:** The spell is recycled instead of going to the trash, so Endless Riches
    no longer applies.

    - **Endless Riches first:** The spell would be banished instead of going to the trash, but it is still
    leaving the chain, so the delayed replacement replaces that event with recycling it. [370.2]

    One boundary applies: if the spell''s own effect instructs it to leave the chain during resolution,
    follow that instruction, except Endless Riches still banishes it if that instruction would put it
    in the trash. [390.3.a] [369.1]'
  cited_rule_history:
    '416.1': stable
    416.1.a: stable
    416.1.c: stable
