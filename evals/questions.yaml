- id: r-promising-future-gear-targeting
  question: Can Salvage or Brittle Steel target Dazzling Aurora if both are chosen with Promising Future?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:337.1.b
  - core@1.4:337.2
  - core@1.4:359.2.d
  - core@1.4:355.5
  - core@1.4:355.7
  - core@1.4:355.9.a
  - core@1.4:355.9.a.1
  - core@1.4:355.8
  - core@1.4:358.5
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: other
  answer: 'In a two-player game, Salvage or Brittle Steel can target Dazzling Aurora only if Promising
    Future''s controller chose the spell and their opponent chose Aurora.

    If Promising Future''s controller chose Aurora and their opponent chose the spell, that spell cannot
    target Aurora.

    Promising Future puts the next player''s chosen card on the chain first, so the opponent''s card finalizes
    first. [337.1.b]

    A gear that finalizes resolves immediately and enters the board. [337.2] [359.2.d]

    A spell chooses its targets during its own finalization, and a gear target must be on the board unless
    another zone is specified. [355.5] [355.7] [355.9.a] [355.9.a.1]

    If the opponent chose Aurora, it enters the board before Promising Future''s controller''s spell chooses
    its target.

    If the opponent chose the spell, it must choose its target while Aurora is still pending on the chain,
    so Aurora is not a legal target.

    Both spells may choose another legal gear instead.

    Salvage may also choose no gear, while Brittle Steel''s play is undone if no legal gear is available.
    [355.8] [358.5]'
