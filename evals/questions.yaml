- id: r-deathknell-trigger-timing
  question: When is a Deathknell ability added to the chain?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:808.1.d.2
  - core@1.4:808.1.d.3
  - core@1.4:808.1.d.1
  - core@1.4:808.2
  - core@1.4:808.2.a
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: mechanics
  answer_short: other
  answer: 'A Deathknell ability is added to the chain before its permanent moves to the trash. [808.1.d.2]

    At that point it is a pending item, an ability waiting to be finalized.

    Before the permanent leaves the board, the game records its location, attributes, and other information
    needed to process the ability. [808.1.d.3]

    If the permanent''s death is replaced and it is not sent to the trash, the pending ability is removed
    from the chain. [808.1.d.1]

    Each instance of Deathknell triggers separately, and the permanent''s controller chooses the order
    in which those pending abilities are added. [808.2] [808.2.a]'
  cited_rule_history:
    808.1.d.2: changed
    808.1.d.3: changed
    808.1.d.1: new-in-1.4
    '808.2': stable
    808.2.a: stable
