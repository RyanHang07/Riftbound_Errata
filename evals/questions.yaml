- id: r-karthus-eternal-countering-dual-deathknells
  question: Does a single Not So Fast counter both Deathknell triggers when Karthus, Eternal is on the
    board?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:808.1.d.2
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: 'no'
  answer: 'No.

    If both Deathknell triggers are legal targets for Not So Fast, one copy can counter only one of them.

    When a friendly unit with Deathknell dies while Karthus is on the board, his ability causes that Deathknell
    to trigger an additional time.

    Each trigger is added to the chain as its own independent pending item. [808.1.d.2]

    Not So Fast targets a single spell or ability, so each copy can counter only one trigger.

    This applies only when the Deathknell ability chooses one of your friendly units or gear.

    Otherwise, Not So Fast cannot target either trigger.'
