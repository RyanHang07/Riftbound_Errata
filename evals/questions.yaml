- id: r-abandoned-hall-movement-eligibility
  question: Can a unit moved into or away from Abandoned Hall by a spell be targeted?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:190.6.c
  - core@1.4:355.9.b
