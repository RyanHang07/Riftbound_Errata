- id: r-khazix-mutating-horror-unit-play-in-response
  question: Can an opponent play a unit in reaction to Kha'Zix, Mutating Horror's trigger to prevent the
    effect?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:383.2.a.1
  - core@1.4:383.4.e.2.a
  - core@1.4:383.4.e.2.b
  - core@1.4:383.4.f.2.a
  - core@1.4:383.4.f.2.b
  - core@1.4:383.3
  - core@1.4:383.2.b
  - core@1.4:406.5
  - core@1.4:330.2
  - core@1.4:419.1
  - core@1.4:337.2
  - core@1.4:359.2.c
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: 'no'
  answer: 'No.

    Even if an opponent can legally play a unit in reaction, that unit''s arrival does not undo Kha''Zix''s
    fulfilled trigger condition.

    Kha''Zix''s ability reads "When I attack or defend, if an enemy unit is alone here, give me +2 Might
    this turn and gain 2 XP."

    The "if" clause immediately follows the initial trigger clause, so it is part of the trigger condition.
    [383.2.a.1]

    The condition is evaluated once, when Kha''Zix gains the attacker or defender designation. [383.4.e.2.a]
    [383.4.e.2.b] [383.4.f.2.a] [383.4.f.2.b]

    If the enemy unit is alone then, the ability is placed on the chain. [383.3]

    Because the "if" clause is part of the condition rather than the effect, the effect does not check
    it again during resolution. [383.2.b] [406.5]

    If the enemy unit is not alone then, the ability does not trigger even if another enemy unit is later
    removed.

    Playing a legally timed unit places it on the existing chain as a pending item. [330.2] [419.1]

    After it finalizes, the unit resolves immediately and enters the board. [337.2] [359.2.c]

    This later entry does not repeat Kha''Zix''s earlier trigger-condition check.'
  cited_rule_history:
    383.2.a.1: new-in-1.4
    383.4.e.2.a: changed
    383.4.e.2.b: stable
    383.4.f.2.a: changed
    383.4.f.2.b: stable
    '383.3': stable
    383.2.b: new-in-1.4
    '406.5': stable
    '330.2': changed
    '419.1': stable
    '337.2': new-in-1.4
