- id: r-movement-failed-move-linked-instructions
  question: Does a later linked instruction still execute if a move is prevented or cannot happen?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:359.3.e.6
  - core@1.4:359.3.e.14.a
  version_dependent: null
  stale_text_exists: false
  provenance: mined
  stratum: expert-ruling-faq
  category: general-rules
  answer_short: other
  answer: 'If the move is prevented or cannot happen for a reason other than an illegal or unavailable
    target, yes, unless the linked instruction specifically requires the move to have occurred.

    The Vendetta FAQ classifies the failed move as negated rather than ignored, so it does not cause other
    linked instructions to be ignored.

    Note (Rules citation needed):

    Core Rules 1.4 still describes a move prevented by a location restriction as ignored. [359.3.e.6]

    It would therefore also ignore a later linked instruction under the current Core Rules wording. [359.3.e.14.a]

    The Vendetta FAQ takes precedence on this point until a later Core Rules Document says otherwise.'
