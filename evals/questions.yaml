- id: r-alpha-strike-split-distribution
  question: When and how is Alpha Strike's damage distributed?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:355.14.e
  - core@1.4:359.3.e.2
  - core@1.4:359.3.f.2.a
  - core@1.4:359.3.e.7
  - core@1.4:359.3.f.1
  - core@1.4:359.3.f.2
  - core@1.4:355.14.h
  - core@1.4:355.14.h.1
  - core@1.4:355.14.f
  - core@1.4:355.14.g
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: other
  answer: 'Alpha Strike''s controller chooses how to distribute its damage during resolution, not while
    choosing targets. [355.14.e]

    -

    As Alpha Strike begins resolving, determine which chosen units remain legal targets. [359.3.e.2]

    -

    If the friendly target is illegal, Alpha Strike deals no damage because that target provides no usable
    might. [359.3.f.2.a]

    If no enemy target remains legal, Alpha Strike deals no damage because its damage instruction does
    not execute. [359.3.e.7]

    -

    Use the friendly target''s might at resolution as the amount of damage to distribute. [359.3.f.1]
    [359.3.f.2]

    -

    If there are more remaining enemy targets than damage, choose exactly enough of those units to cease
    being targets so the number of targets does not exceed the available damage. [355.14.h] [355.14.h.1]

    -

    Distribute all available damage among the remaining enemy targets, assigning at least 1 damage to
    each. [355.14.f] [355.14.g]

    If only one enemy target remains, assign all available damage to it.'
  cited_rule_history:
