- id: r-showdowns-showdown-close
  question: When does a showdown close?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:347.2.a
  - core@1.4:348
  - core@1.4:323.5
  - core@1.4:346
  - core@1.4:347.1
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: general-rules
  answer_short: other
  answer: 'A showdown closes only after every player passes focus in sequence without playing a spell
    or activating an ability. [347.2.a] [348]

    It does not close merely because a unit leaves or is killed.

    Note (Example):

    You control a battlefield with a 2 might Stalwart Poro on it.

    Your opponent moves their Ravenbloom Student into that battlefield starting a showdown.

    When combat opens, Stalwart Poro becomes a defender and its Shield increases its might to 3.

    Once your opponent gains focus, they play Hextech Ray targeting Stalwart Poro.

    Hextech Ray resolves, marking 3 damage on it.

    During the resulting cleanup, Stalwart Poro is killed for lethal damage. [323.5]

    The showdown remains open, and you gain focus when the chain empties. [346]

    You may still play a legally timed card or ability before players begin passing focus again. [347.1]'
  cited_rule_history:
