- id: r-promising-future-counterspells
  question: Can a counterspell chosen with Promising Future counter another chosen card?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:354.2
  - core@1.4:354.3
  - core@1.4:355.5
  - core@1.4:355.8
  - core@1.4:358.5
  - core@1.4:337.1.b
  - core@1.4:340.1
  - core@1.4:425.1.a
  - core@1.4:337.1
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: other
  answer: 'Yes, if another chosen card is an eligible spell that finalizes before the counterspell and
    is a legal target when the counterspell is finalized.

    Promising Future puts every chosen card on the chain as a pending item before any of them proceed
    to finalization. [354.2] [354.3]

    Players choose only which card to banish during Promising Future''s first pass.

    The counterspell''s target is chosen later, during that counterspell''s finalization. [355.5]

    A counterspell cannot finalize without a valid target. [355.8]

    If no valid target exists, its play process is undone and it returns to banishment. [358.5]

    Note (Example):

    In a two-player game, suppose the turn player banishes a counterspell.

    The opponent''s card is put on the chain first, followed by the turn player''s counterspell, so the
    opponent''s card undergoes finalization first. [337.1.b]

    If the opponent chose a spell that the counterspell can target, the turn player can choose that spell
    while finalizing the counterspell.

    The counterspell is newer and therefore resolves first, allowing it to counter the opponent''s spell
    before that spell resolves. [340.1] [425.1.a]

    A counterspell put on the chain before another chosen card must finalize or leave the chain before
    that later card can finalize. [337.1] [337.1.b]

    It needs a legal target when its own targets are chosen.'
  cited_rule_history:
    '354.2': stable
    '354.3': stable
    '355.5': stable
    '355.8': stable
    '358.5': new-in-1.4
