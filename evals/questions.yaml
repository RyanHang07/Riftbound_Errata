- id: r-glasc-mixologist-play-to-same-battlefield
  question: Can Glasc Mixologist's Deathknell play a unit to the battlefield where he died?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:808.1.d.2
  - core@1.4:334.2
  - core@1.4:330
  - core@1.4:309.1
  - core@1.4:323.6
  - core@1.4:355.2.a
  - core@1.4:190.4.b
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: other
  answer: 'Yes, as long as you controlled that battlefield when Glasc Mixologist died.

    **Outside a showdown**, Glasc''s Deathknell is added as a pending item before he moves to the trash
    and remains pending throughout that cleanup. [808.1.d.2] [334.2]

    That pending ability keeps the chain in progress throughout the cleanup, so you do not lose control
    of the battlefield even if Glasc''s death leaves it empty. [330] [309.1] [323.6]

    You can therefore choose that battlefield as a valid destination when the unit is finalized. [355.2.a]

    **During a showdown**, control of the battlefield cannot change until instructed by the steps of the
    combat or showdown, [190.4.b] so the question does not arise.'
  cited_rule_history:
    808.1.d.2: changed
    '334.2': stable
    '330': stable
    '309.1': stable
    '323.6': new-in-1.4
    355.2.a: stable
    190.4.b: stable
  source:
