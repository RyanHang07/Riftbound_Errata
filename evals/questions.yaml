- id: r-temporal-breach-attached-equipment
  question: What happens to equipment attached to a unit banished by Temporal Breach?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:719.5
  - core@1.4:435.4.b
  - core@1.4:124
  - core@1.4:435.4.a
  - core@1.4:323.7
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: other
  answer: 'The equipment detaches at the unit''s previous location and does not reattach when the unit
    is played again.

    Moving the unit from the board to banishment detaches its attached cards at that last location. [719.5]
    [435.4.b]

    The unit entering the board is a new game object, and Temporal Breach does not instruct the equipment
    to attach again. [124]

    Detached equipment at a battlefield is recalled to its controller''s base during the next cleanup.
    [435.4.a]

    Detached equipment at a base its controller does not control is recalled to its controller''s base
    during cleanup. [323.7]

    Equipment already at its controller''s base remains there. [323.7]'
