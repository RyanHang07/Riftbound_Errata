- id: r-movement-entering-board
  question: Does a unit move when it enters the board?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:446.1
  - core@1.4:446.2
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: general-rules
  answer_short: 'no'
  answer: 'No.

    Moving means changing a permanent''s position from one space on the board to another. [446.1]

    A card entering the board from another game zone is a zone change, not a move. [446.2]

    Playing or creating a unit at a battlefield therefore does not fulfill an ability that triggers when
    the unit moves there.

    Replacing where a unit enters the board also does not turn that entry into a move.'
