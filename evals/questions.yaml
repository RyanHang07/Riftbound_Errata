  - core@1.4:406.4
  version_dependent: null
  stale_text_exists: false
  provenance: mined
  stratum: expert-ruling-faq
  category: cards
  answer_short: other
  answer: 'You can react before its controller names a spell, but once the name is chosen, it is too late
    to start playing that spell while Fallen Feline remains at a battlefield.

    The name is chosen only when the play effect resolves, [355.17] after players have had the opportunity
    to react to the finalized ability. [406.4]

    The Vendetta FAQ confirms this timing.'
