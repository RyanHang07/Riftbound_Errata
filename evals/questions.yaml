  answer: 'Yes.

    The unit is killed while Sacrifice''s additional cost is being paid. [356.7] [357.2]

    Its Deathknell is therefore added above Sacrifice as a pending ability. [808.1.d.2]

    The Deathknell resolves before Sacrifice draws and channels. [337.2] [340.1]

    ### Steps [#deathknell-sequence]

    -

    Sacrifice moves to the chain as a pending spell. [354.2]

    Its controller then pays the additional cost by killing a friendly Mighty unit.

    -

    That unit''s Deathknell is added above Sacrifice as a pending ability before the unit moves to the
    trash. [808.1.d.2]

    -

    Sacrifice finishes finalizing. [359.3.a]

    The pending Deathknell then finalizes. [337.1] [359.3.b] [406.2]

