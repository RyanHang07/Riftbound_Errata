- id: r-arcane-shift-replay-at-same-battlefield
  question: Can I use Arcane Shift to banish the only unit I own and control at a battlefield I control,
    then play it there again?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:321.1
  - core@1.4:354.2
  - core@1.4:354.3
  - core@1.4:323.6
  - core@1.4:330
  - core@1.4:331.1
  - core@1.4:355.2.a
  - core@1.4:186.1
  - core@1.4:319.6
  - core@1.4:419.3
  - core@1.4:354.4
  - core@1.4:359.2.c
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: other
  answer: 'Yes, as long as the unit is not a token and you control that battlefield.

    For a non-token unit, by the time battlefield control is checked, the unit''s owner has started playing
    it, leaving the unit pending on the chain while Arcane Shift finishes resolving. [321.1] [354.2] [354.3]

    That pending unit keeps the chain active, so you keep control of the battlefield and may choose it
    for the unit''s return. [323.6] [330] [331.1] [355.2.a]

    A token unit instead ceases to exist immediately after moving to banishment, before Arcane Shift can
    instruct its owner to play it again. [186.1]

    ### Steps [#replay-sequence]

    -

    Arcane Shift banishes the unit, causing a cleanup. [319.6]

    Arcane Shift then instructs the unit''s owner to play it, moving the unit to the chain as a pending
    item before the spell finishes resolving. [354.2] [354.3] [419.3]

    -

    Cleanup runs while the unit remains pending, so the active chain prevents you from losing control
    of the empty battlefield. [321.1] [323.6] [330] [331.1] [354.4]

    -

    During finalization, you choose the still-controlled battlefield as the unit''s location. [355.2.a]

    The unit then enters there. [359.2.c]'
