- id: r-kennen-storm-of-shuriken-minefield-flow
  question: Can Kennen grant Flow to a spell put into the trash by Minefield's ability triggered by the
    same conquer?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:355.5
  - core@1.4:355.8
  - core@1.4:383.3.d
  - core@1.4:337.1
  - core@1.4:337.3
  - core@1.4:337.4
  - core@1.4:355.15
  version_dependent: null
  stale_text_exists: false
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: 'no'
  answer: 'No.

    You must choose a spell already in your trash for Kennen''s conquer ability when the ability is finalized
    on the chain. [355.5] [355.8]

    Kennen''s ability and Minefield''s ability trigger simultaneously from the same conquer and are added
    to the chain as pending items. [383.3.d]

    Their order does not change the result because every pending item must be finalized before either
    ability can resolve. [337.1] [337.3] [337.4]

    Minefield therefore cannot put its two cards into your trash until after you have chosen a spell for
    Kennen''s ability, and you cannot later change that choice. [355.15]'
