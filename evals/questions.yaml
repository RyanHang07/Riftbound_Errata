- id: r-irresistible-faefolk-removed-in-response
  question: If an opponent responds to my move trigger by removing Irresistible Faefolk from the battlefield,
    does the enemy unit still move?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:425.1
  - core@1.4:425.2.a
  - core@1.4:406.5
  - core@1.4:359.3.f.3
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: other
  answer: 'Yes, removing Irresistible Faefolk by itself does not stop the enemy unit from moving.

    Removing Irresistible Faefolk is not a counter instruction. [425.1] [425.2.a]

    Its already-finalized ability remains on the chain and executes like a spell. [406.5]

    Irresistible Faefolk''s trigger condition identifies the battlefield it moved to, so the ability records
    that battlefield when it triggers. [359.3.f.3]

    Removing Irresistible Faefolk later does not erase that destination, so the chosen enemy unit can
    still move there when the ability resolves.'
