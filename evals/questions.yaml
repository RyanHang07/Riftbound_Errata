- id: r-brynhir-thundersong-existing-cards
  question: Does Brynhir Thundersong stop cards already on the chain?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:419.1
  - core@1.4:358.3.a
  version_dependent: null
  stale_text_exists: false
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: 'no'
  answer: 'No.

    A card already on the chain has already started its play because playing a card means placing it there
    and queuing it for finalization. [419.1]

    Once Brynhir Thundersong''s play effect resolves, it prevents opponents from starting further plays
    that turn, but it does not stop cards already on the chain from finalizing or resolving.

    If one of those cards later instructs an opponent to play another card, Brynhir can still make the
    new play impossible.

    Brynhir prevents that new play, so the second card stays in its current zone while the card already
    on the chain continues resolving. [358.3.a]'
  cited_rule_history:
    '419.1': stable
    358.3.a: new-in-1.4
  source:
    url: https://github.com/ChristianIvicevic/riftboundfaq/blob/816d3b32d32a9966fc73367efb690fcbb4c195ca/content/(rulings)/cards/brynhir-thundersong.mdx#existing-cards
    authors:
