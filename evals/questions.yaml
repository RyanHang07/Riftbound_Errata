  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: other
  answer: 'You skip every Draw Phase you would have for as long as Endless Riches remains on the board.

    "Skip your Draw Phase" is a passive ability and a replacement effect that replaces your Draw Phase
    with nothing. [364.2] [443.1.a]

    Passive abilities of permanents become active when the permanent enters the board and are typically
    active only while it remains there. [359.2.a] [365.1]

    Once Endless Riches leaves the board, this ability is no longer active, so your later Draw Phases
    occur normally.'
