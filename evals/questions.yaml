- id: r-karthus-eternal-simultaneous-deathknell
  question: Does Karthus, Eternal's ability apply if he dies from the same effect as the unit with Deathknell?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:370.1.a.2
  - core@1.4:428.1.a.1.b
  - core@1.4:365.1
  - core@1.4:323.4
  - core@1.4:323.5
  version_dependent: null
  stale_text_exists: false
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: other
  answer: 'Karthus applies to your other unit''s Deathknell if the deaths are simultaneous or that unit
    is killed before Karthus.

    He doesn''t apply if a separate kill action kills him first.

    When one kill action kills Karthus and another unit simultaneously, [370.1.a.2] as with The Ruination,
    the other unit''s Deathknell is added before the kill instruction moves Karthus off the board. [428.1.a.1.b]

    His passive ability is therefore still active and makes your Deathknell effect trigger an additional
    time. [365.1]

    If one effect instead performs separate kill actions, those deaths are sequential. [370.1.a.2]

    Karthus applies only if the Deathknell unit is killed first, because his passive ability is active
    only while he remains on the board. [365.1]

    When both units instead have lethal damage during a cleanup, all relevant death triggers are added
    before either unit is killed and moved to the trash. [323.4] [323.5]'
  cited_rule_history:
    370.1.a.2: new-in-1.4
    428.1.a.1.b: new-in-1.4
    '365.1': stable
    '323.4': new-in-1.4
    '323.5': new-in-1.4
  source:
    url: https://github.com/ChristianIvicevic/riftboundfaq/blob/816d3b32d32a9966fc73367efb690fcbb4c195ca/content/(rulings)/cards/karthus-eternal.mdx#simultaneous-deathknell
    authors:
