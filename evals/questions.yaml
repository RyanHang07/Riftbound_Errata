- id: r-akshan-mischievous-aurora-timing
  question: If my Dazzling Aurora plays Akshan, Mischievous at the end of my turn, will the Dazzling Aurora
    I take from my opponent trigger that turn?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:317.1.a
  - core@1.4:383.1
  - core@1.4:191.4.a
  - core@1.4:383.2.c
  - core@1.4:383.4.a
  - core@1.4:383.4.a.2
  - core@1.4:406.5
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: 'no'
  answer: 'No.

    You gain control of the enemy Dazzling Aurora after its end-of-turn trigger condition has already
    been checked.

    "At the end of your turn" refers to the Ending Step''s end-of-turn point. [317.1.a] [383.1]

    At that point, the enemy Dazzling Aurora is still controlled by your opponent, so its controller-relative
    "your turn" condition does not refer to your turn. [191.4.a] [383.2.c]

    Your Dazzling Aurora''s end-of-turn ability plays Akshan after that point in the turn has been reached.

    After Akshan enters the board, his play effect is added to the chain as a pending item. [383.4.a]
    [383.4.a.2]

    You gain control of the enemy Dazzling Aurora only when that ability later resolves. [406.5]

    If you take control of an enemy Dazzling Aurora before the Ending Step, it triggers normally at the
    end of that turn.'
