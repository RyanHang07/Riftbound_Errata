- id: r-rebuttal-hidden-target-restriction
  question: Can Rebuttal redirect a spell played from Hidden to another location?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:752.1
  - core@1.4:753.1
  - core@1.4:811.1.d.2
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: 'no'
  answer: 'No.

    Taking control of the spell and making new choices for it does not remove the targeting restriction
    imposed by Hidden.

    Rebuttal allows you to remake a finalized spell''s targets, [752.1] but every new target must still
    be legal. [753.1]

    When a spell is played from Hidden, its targets must be chosen from among the options at the battlefield
    where it was hidden unless the spell''s own targeting restriction makes that impossible. [811.1.d.2]

    Changing the spell''s controller does not change where it was played from, so this restriction continues
    to apply.

    Note (Example):

    An opponent plays Hidden Blade from Hidden and chooses a unit at that battlefield.

    If you gain control of Hidden Blade with Rebuttal, you may choose another legal unit at the same battlefield.

    You cannot choose a unit at another battlefield, and you cannot choose a unit at base because Hidden
    Blade itself requires a unit "at a battlefield."'
  cited_rule_history:
    '752.1': new-in-1.4
    '753.1': new-in-1.4
    811.1.d.2: changed
