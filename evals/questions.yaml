- id: r-heedless-resurrection-self-resurrection
  question: Can I kill a unit with Heedless Resurrection's cost and then resurrect that same unit?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:355.5
  - core@1.4:355.8
  - core@1.4:355.9.a
  - core@1.4:357.2
  - core@1.4:355.15
  version_dependent: null
  stale_text_exists: false
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: 'no'
  answer: 'No.

    You choose a unit already in a trash before you kill a friendly unit to pay Heedless Resurrection''s
    additional cost.

    The unit you plan to kill is still on the board when the resurrection target is chosen, so it cannot
    be that target.

    In the formal play sequence, the resurrection target is selected during step 2 and must be legal then.
    [355.5] [355.8] [355.9.a]

    The kill cost is paid during step 4, after the target choice has already been locked in. [357.2] [355.15]'
