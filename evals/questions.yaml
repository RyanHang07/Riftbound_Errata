- id: r-equipment-equipment-reactions
  question: Can opponents react to Equip, Quick-Draw, or Weaponmaster abilities?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:818.1
  - core@1.4:377.3
  - core@1.4:406.4
  - core@1.4:337.1.a
  - core@1.4:337.2
  - core@1.4:383.4.a.2
  - core@1.4:819.1.d
  - core@1.4:821.1.b
  version_dependent: null
  stale_text_exists: false
  provenance: mined
  stratum: expert-ruling
  category: mechanics
  answer_short: other
  answer: 'Opponents can react before Equip, Quick-Draw, or Weaponmaster attaches equipment, but they
    cannot react before the Quick-Draw gear itself enters the board.

    Equip is an activated ability that uses the chain. [818.1] [377.3]

    Other players have an opportunity to play Reactions before it resolves. [406.4]

    The Quick-Draw gear resolves immediately when finalized and enters the board before its triggered
    ability is put on the chain. [337.1.a] [337.2] [383.4.a.2] [819.1.d]

    Other players can react before that ability resolves and attaches the gear. [406.4]

    Weaponmaster is also a play effect put on the chain after its unit enters. [821.1.b] [383.4.a.2]

    Other players can react before it resolves and attaches the chosen equipment. [406.4]'
  cited_rule_history:
    '818.1': stable
    '377.3': stable
    '406.4': new-in-1.4
    337.1.a: new-in-1.4
