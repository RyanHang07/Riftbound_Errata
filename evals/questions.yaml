- id: r-elder-dragon-combat-damage-assignment
  question: How does Elder Dragon affect combat damage assignment?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:142.3.b
  - core@1.4:142.4.c
  - core@1.4:417.1.e
  - core@1.4:465.2.c.3
  - core@1.4:465.2.c.4
  - core@1.4:465.2.c.4.a
  - core@1.4:465.2.c.5
  - core@1.4:323.5
  - core@1.4:465.2.d
  - core@1.4:466.1.a
  - core@1.4:383.2.c
  - core@1.4:390.2
  - core@1.4:465.2.c.1
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: other
  answer: 'While you control Elder Dragon on the board, 1 combat damage from your units is lethal to an
    enemy unit regardless of its might, unless another effect changes how much must be assigned or prevents
    that damage.

    Elder Dragon changes the lethal-damage value for enemy units with its controller''s damage, and the
    smallest valid amount of damage is 1. [142.3.b] [142.4.c] [417.1.e]

    You must assign lethal damage to one unit before assigning damage to another, and you cannot assign
    more than the lethal minimum while another unit remains. [465.2.c.3] [465.2.c.4]

    With Elder Dragon, that normally means assigning exactly 1 damage to an enemy unit before moving to
    the next.

    Prevention and other replacement effects are considered during assignment and can change this minimum.
    [465.2.c.4.a] [465.2.c.5]

    Note (Elder Dragon vs. Imperial Decree):

    Suppose Pakaa Cub, with 3 might, is your only attacker against three undamaged copies of Noxus Hopeful,
    each defending with 4 might.

    With Elder Dragon, you assign 1 damage from Pakaa Cub to each Noxus Hopeful, and all three are killed
    during the combat cleanup. [323.5] [465.2.d] [466.1.a]

    Imperial Decree does not change lethal damage or combat damage assignment.

    Assigning damage is not dealing damage, so its delayed triggered ability triggers only after a unit
    actually takes damage and then attempts to kill that unit. [383.2.c] [390.2] [465.2.c.1]

    With Imperial Decree instead, Pakaa Cub still assigns all 3 damage, but you cannot split it among
    the three Noxus Hopefuls.

    You must assign lethal damage to one before moving to another, so all 3 damage is assigned to the
    Noxus Hopeful you choose first.

    Of the three Noxus Hopefuls, only that one takes Pakaa Cub''s combat damage, so Imperial Decree''s
    kill ability triggers for it and not the other two.'
