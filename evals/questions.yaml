  version_dependent: null
  stale_text_exists: false
  provenance: mined
  stratum: expert-ruling
  category: mechanics
  answer_short: 'no'
  answer: 'No.

    Ambush changes when the unit can be played, [822.1.b] but the unit otherwise enters normally.

    Finalizing it does not pass priority. [337.1.a]

    It then resolves and enters the board immediately. [337.2] [359.2.c]

    This is a common point of confusion with cards like Kha''Zix, Mutating Horror, which has Ambush and
    triggers if an enemy unit is alone when he attacks or defends.

    An opponent cannot play a unit in response to Kha''Zix being placed on the chain in an attempt to
    break the "alone" condition before he enters.'
