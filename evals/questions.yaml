- id: r-repeat-repeated-spell-countering
  question: What happens if a spell with Repeat is countered?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:820.3.a
  - core@1.4:820.1.d.1
  - core@1.4:425.1.a
  - core@1.4:425.1.c
  - core@1.4:425.1.c.1
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: mechanics
  answer_short: other
  answer: 'Neither the initial nor any additional execution occurs, and the paid Repeat cost is not refunded.

    Repeat does *not* create a second instance of the spell on the chain. [820.3.a]

    Instead, it modifies how the spell resolves by executing its instructions an additional time. [820.1.d.1]

    When a spell is countered, it does nothing and is cleared from the chain, so none of its executions
    happen. [425.1.a]

    Countering does not refund additional costs paid to play the spell. [425.1.c] [425.1.c.1]'
  cited_rule_history:
    820.3.a: new-in-1.4
    820.1.d.1: new-in-1.4
    425.1.a: stable
    425.1.c: changed
    425.1.c.1: stable
  source:
    url: https://github.com/ChristianIvicevic/riftboundfaq/blob/816d3b32d32a9966fc73367efb690fcbb4c195ca/content/(rulings)/mechanics/repeat.mdx#repeated-spell-countering
    authors:
    - Christian “Near” Ivicevic
    reviewed_core_rules: '1.4'
    created: '2026-02-02'
