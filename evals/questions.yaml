  provenance: mined
  stratum: expert-ruling
  category: mechanics
  answer_short: other
  answer: 'By default, you can activate it only while its source is not Empowered and during your own
    Main Phase while no showdown, combat, or chain is in progress. [310.1] [310.1.a] [312.2.a] [381] [827.1.c.1]

