- id: r-baited-hook-deathknell-order
  question: Does a unit's Deathknell resolve before or after the unit played by Baited Hook and its triggers?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:337.1.b
  - core@1.4:340.1
  - core@1.4:808.1.d.2
  - core@1.4:354.2
