- id: r-equipment-equipment-unit-selection
  question: Do Equip, Quick-Draw, or Weaponmaster count as choosing a unit?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:383.4.b.3
  - core@1.4:818.1.b
  - core@1.4:818.1.b.1
  - core@1.4:818.1.c.2
