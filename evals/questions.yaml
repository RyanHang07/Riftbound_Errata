- id: r-baron-nashor-might-loss-survival
  question: Can a unit survive combat damage that becomes lethal when Baron Nashor dies in the same combat?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:323.5
  - core@1.4:142.4.b
  - core@1.4:365.1
  - core@1.4:466.1.a.1
  - core@1.4:319.6
  - core@1.4:322
  version_dependent: null
  stale_text_exists: false
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: other
  answer: 'Yes, if the unit does not have lethal damage when the cleanup checks it while Baron Nashor''s
    +2 might still applies.

    The cleanup checks all units for lethal damage only once, so a unit that becomes lethal after Baron
    Nashor leaves is not checked again during that cleanup. [323.5]

    ### Steps [#might-loss-survival-sequence]

    Suppose Baron Nashor is assigned lethal combat damage and a friendly Evelynn, Entrancing is assigned
    2 combat damage.

    -

    **Lethal-damage check:** Baron Nashor has lethal damage, while Evelynn''s 2 marked damage is less
    than her current 4 might: 2 printed might plus Baron Nashor''s +2. [142.4.b]

    Of the two, only Baron Nashor has lethal damage during the check, so the cleanup kills him and not
    Evelynn. [323.5]

    -

    Baron Nashor''s passive ability stops applying when he leaves the board. [365.1]

    Evelynn therefore returns to 2 might after the lethal-damage check has finished.

    Her 2 marked damage is now lethal. [142.4.b]

    That cleanup does not check her again.

    -

    **Combat healing:** The combat special cleanup heals all units, clearing Evelynn''s marked damage.
    [466.1.a.1]

    -

    Baron Nashor''s departure causes another cleanup. [319.6] [322]

    Evelynn has no marked damage when that cleanup checks for lethal damage, so she is not killed. [323.5]'
  cited_rule_history:
    '323.5': new-in-1.4
    142.4.b: new-in-1.4
    '365.1': stable
    466.1.a.1: new-in-1.4
