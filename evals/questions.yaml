- id: r-showdowns-attack-defend-triggers
  question: When do attack and defend triggers happen?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:383.4.e
  - core@1.4:383.4.f
  - core@1.4:464.2.c.3
  - core@1.4:464.2.c.3.a
  - core@1.4:383.4.e.2.b
  - core@1.4:383.4.f.2.b
  - core@1.4:383.4.e.2.a
  - core@1.4:383.4.f.2.a
  - core@1.4:323.2.c
  - core@1.4:323.2.a
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: general-rules
  answer_short: other
  answer: 'An attack or defend trigger is checked when its unit or player first gains the matching attacker
    or defender designation during a combat. [383.4.e] [383.4.f]

    Units already present gain their designations when combat opens, while units that become present later
    gain them during the cleanup following their arrival. [464.2.c.3] [464.2.c.3.a]

    If the trigger has another condition, that condition must also be fulfilled at that time. [383.4.e.2.b]
    [383.4.f.2.b]

    ### Units can join combat late and still trigger [#late-combat-triggers]

    If a unit becomes present at a battlefield where combat is already in progress, it gains its controller''s
    attacker or defender designation during the next cleanup.

    Its eligible "When I attack" or "When I defend" abilities trigger then, after their other conditions
    are checked.

    ### Can attack and defend abilities trigger more than once per combat? [#once-per-combat-triggers]

    An attack or defend trigger''s condition is checked only once per combat, even if its unit loses and
    regains the matching designation. [383.4.e.2.a] [383.4.f.2.a]

    A unit that leaves the combat battlefield loses its designation during the next cleanup. [323.2.c]

    If it returns during the same combat, it regains its controller''s designation during a later cleanup,
    but its attack or defend trigger is not checked again. [323.2.a]'
