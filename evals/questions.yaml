- id: r-abilities-triggered-ability-timing
  question: Can triggered abilities trigger on an opponent's turn without Reaction?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:383.3
  - core@1.4:383.3.c
  - core@1.4:400
  - core@1.4:400.1
  - core@1.4:383.3.a.2
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: general-rules
  answer_short: 'yes'
  answer: 'Yes.

    A triggered ability is put on the chain whenever its condition is met, regardless of whose turn it
    is, so it does not need Reaction. [383.3] [383.3.c]

    It first enters as a pending item: it has triggered but must still complete the required choices and
    costs before it finalizes and can resolve. [400] [400.1]

    If its controller declines an initial "you may," that pending ability is removed from the chain and
    considered not to have triggered. [383.3.a.2]

    Note (Example):

    Blade Dancer triggers whenever you choose a friendly unit.

    This can happen on an opponent''s turn when you play a Reaction spell that chooses one of your units.'
  cited_rule_history:
