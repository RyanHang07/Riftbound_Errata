- id: r-deathknell-killing-card-timing
  question: Does Deathknell resolve before the card or ability that killed the unit?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:354.2
  - core@1.4:357.2
  - core@1.4:401.1
  - core@1.4:404.1
  - core@1.4:808.1.d.2
  - core@1.4:359.3.b
  - core@1.4:406.3
  - core@1.4:340.1
  - core@1.4:204.3.b
  - core@1.4:401.2
  - core@1.4:158.3
  - core@1.4:321
  - core@1.4:321.1
  - core@1.4:323.4
  - core@1.4:323.5
  - core@1.4:334.2
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: mechanics
  answer_short: other
  answer: 'It depends on when the unit is killed.

    - **Killed to pay a cost while a spell or ability is being finalized:** The Deathknell resolves first.

    The original item is already pending when its cost is paid. [354.2] [357.2] [401.1] [404.1]

    It finishes finalizing before the newer Deathknell, which then resolves first. [808.1.d.2] [359.3.b]
    [406.3] [340.1]

    For example, if Sacrifice kills Ruined Rex as its additional cost, Ruined Rex''s Deathknell resolves
    before Sacrifice draws 2 and channels 1 rune exhausted.

    - **Killed during resolution:** The killing card or ability finishes first, including when the kill
    pays a cost within its instructions.

    Costs within instructions in spells and activated abilities, and those appearing later in triggered
    abilities, are paid during resolution. [204.3.b]

    The Deathknell is added before its permanent moves to the trash, but it cannot finalize or resolve
    until the current item finishes. [808.1.d.2] [401.2] [158.3]

    For example, after Baited Hook kills a unit, it finishes every remaining instruction before that unit''s
    Deathknell can resolve.

    - **Killed by lethal damage:** The card or ability that dealt the damage finishes first because cleanup
    cannot begin during its resolution. [321] [321.1]

    The Deathknell is added during the subsequent cleanup and cannot finalize until that cleanup ends.
    [323.4] [323.5] [334.2]'
