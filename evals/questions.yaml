- id: r-chain-and-priority-pending-item-order
  question: In what order are multiple pending chain items finalized and resolved?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:337.1
  - core@1.4:337.1.b
  - core@1.4:340.1
  - core@1.4:337.2
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: general-rules
  answer_short: other
  answer: 'Pending items undergo finalization from oldest to newest, finalized items still waiting on
    the chain resolve from newest to oldest, and units, gear, and Add abilities resolve as soon as they
    finalize.

    - **Pending items:** Take them through finalization in the order they were added, from oldest to newest,
    until each item finalizes or leaves the chain. [337.1] [337.1.b]

    - **Finalized items:** Among those that remain on the chain, the newest resolves first. [340.1]

    - **Immediate resolution:** Units, gear, and abilities that use Add resolve when they finalize, even
    if other pending items still need to finalize. [337.2]'
  cited_rule_history:
    '337.1': new-in-1.4
    337.1.b: new-in-1.4
    '340.1': changed
    '337.2': new-in-1.4
