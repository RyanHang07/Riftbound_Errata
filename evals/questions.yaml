- id: r-akshan-mischievous-dual-akshan-control
  question: If my opponent and I each use Akshan, Mischievous to take the same gear, who controls it when
    either Akshan dies?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:390.4
  - core@1.4:391
  - core@1.4:477.1.a
  - core@1.4:478
  - core@1.4:480
  - core@1.4:480.1
  - core@1.4:480.3
  - core@1.4:428.2
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: other
  answer: 'The most recently played Akshan takes precedence while both are on the board.

    If either Akshan dies, the surviving Akshan controls the gear.

    Each resolved play effect creates a delayed passive ability, a control effect that remains active
    until that Akshan leaves the board. [390.4] [391]

    While both effects remain, they independently change the gear''s controller in the same trait-altering
    layer. [477.1.a] [478]

    The effect established most recently applies last and determines who controls the gear. [480] [480.1]
    [480.3]

    When an Akshan dies, that Akshan''s control effect ends and the surviving effect determines control.
    [428.2]'
