- id: r-glasc-mixologist-deathknell-combat-result
  question: What happens when Glasc Mixologist is my only defender and his Deathknell plays a unit where
    he died?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:466.2
  - core@1.4:466.3.a
  - core@1.4:466.3.d
  - core@1.4:466.3.d.1
  - core@1.4:466.1.a.1
  - core@1.4:334.2
  - core@1.4:466.1.a.2
  - core@1.4:354.2
  - core@1.4:354.3
  - core@1.4:359.2.c
  - core@1.4:383.4.a.2
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: other
  answer: 'The original combat result is determined only after Glasc''s chosen unit enters and every associated
    chain item finishes. [466.2]

    At that point, the result depends on which players have units at the battlefield:

    - **Only your units remain:** You win the original combat. [466.3.a]

    - **Only your opponent''s units remain:** Your opponent wins the original combat. [466.3.a]

    - **Both players have units there:** Neither player wins, and a second combat is staged. [466.3.d]
    [466.3.d.1]

    - **Neither player has units there:** Neither player wins, and no second combat is staged. [466.3.d]
    [466.3.d.1]

    ### Steps [#combat-result-sequence]

    -

    The combat cleanup heals all units before Glasc''s pending Deathknell can be finalized. [466.1.a.1]
    [334.2]

    Because Glasc was your only defender, no defenders remain during cleanup, so the surviving attackers
    are not recalled. [466.1.a.2]

    -

    After the cleanup, Glasc''s Deathknell resolves and begins playing the chosen unit.

    The unit becomes pending while the ability finishes. [354.2] [354.3]

    -

    The unit then finalizes and enters the battlefield exhausted. [359.2.c]

    Any play effect and other resulting chain items also finish before combat result is determined. [383.4.a.2]

    -

    The players'' units then determine who won the original combat and whether another combat is staged.'
  cited_rule_history:
    '466.2': new-in-1.4
    466.3.a: stable
    466.3.d: new-in-1.4
    466.3.d.1: changed
    466.1.a.1: new-in-1.4
    '334.2': stable
    466.1.a.2: changed
    '354.2': stable
    '354.3': stable
    359.2.c: stable
    383.4.a.2: stable
  source:
