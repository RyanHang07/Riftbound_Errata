  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: other
  answer: 'During finalization, you decide whether to use the ability [383.3.a] and, if you do, pay [1]
    and return the unit. [383.3.b] [383.3.b.1]

    Both actions form one inseparable base cost, so you must complete them together for the ability to
    finalize. [740.4.a]

    The pending ability is removed without finalizing if no legal unit can be chosen [402.4] or if you
    decline the complete cost. [404.2]

    While paying the energy, you may activate an eligible Add ability with Reaction to provide it. [444.2.c]

    The unit you return is part of the cost rather than a target, and it returns to its owner''s hand
    during finalization. [355.10.c] [355.10.c.1]

    If you have paid the cost, the ability finalizes and opponents may then react before it resolves.
    [406.2] [406.4]

    Note (Errata):

    Emperor''s Dais received functional errata.

    Older printings connect the Sand Soldier instruction with "If you do, play"; the current text uses
    "to play" instead.

    This changes the energy payment and unit return from instructions performed during resolution into
    one cost completed while finalizing the ability.'
