- id: r-chain-and-priority-partial-chain-reactions
  question: Can I play a reaction after one, but not all, items on the chain have resolved?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:337.1
  - core@1.4:340.3
  - core@1.4:340.4
  - core@1.4:338.1.a
  - core@1.4:338.1.a.2
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: general-rules
  answer_short: 'yes'
  answer: 'Yes.

    If another finalized item remains after one item resolves, the newest remaining item''s controller
    receives priority before it resolves once any pending items have finalized or left the chain. [337.1]
    [340.3] [340.4]

    That player may use this priority to play a legally timed Reaction. [338.1.a] [338.1.a.2]

    The chain therefore does not have to resolve in its entirety once resolution begins; a new item can
    be added between two resolutions.'
