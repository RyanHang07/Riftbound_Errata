- id: r-smite-death-replacement-effects
  question: Can Guardian Angel, Zhonya's Hourglass, or Tactical Retreat save a unit from Smite?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:372
  - core@1.4:369.1
  - core@1.4:370.1.a.1
  - core@1.4:370.1.b
  - core@1.4:427.2.a
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: other
  answer: 'Yes, if the unit''s controller applies the protective death replacement before Smite''s replacement;
    if they apply Smite''s first, the unit is banished.

    All of these effects replace the same death event, so the affected unit''s controller chooses their
    order. [372]

    Smite''s "if it would die this turn, banish it instead" is a replacement effect. [369.1]

    Guardian Angel, Zhonya''s Hourglass, and Tactical Retreat also replace a unit''s death.

    If the controller applies one of those protective effects first, the kill action does not occur and
    the unit is healed, exhausted, and recalled. [370.1.a.1]

    For the first two effects, the gear also dies in the unit''s place.

    None of those replacement actions is another death event for the affected unit, so Smite has no qualifying
    event left to replace. [370.1.b]

    If Smite''s effect is applied first, it replaces the unit''s death with banishment.

    Banishment is not a kill, [427.2.a] so none of the protective effects applies afterward.'
  cited_rule_history:
    '372': changed
    '369.1': changed
    370.1.a.1: new-in-1.4
    370.1.b: stable
    427.2.a: stable
  source:
    url: https://github.com/ChristianIvicevic/riftboundfaq/blob/816d3b32d32a9966fc73367efb690fcbb4c195ca/content/(rulings)/cards/smite.mdx#death-replacement-effects
    authors:
