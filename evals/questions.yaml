  - core@1.4:359.2.c
  - core@1.4:383.2.c
  - core@1.4:383.3
  - core@1.4:383.4.a.2
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: other
  answer: 'The unit played by Baited Hook enters before the killed unit''s Deathknell resolves.

    Abilities triggered by playing that unit also resolve before the Deathknell.

    Finalizing first does not mean resolving first: pending items finalize in the order they were added
    to the chain, [337.1.b] but the newest finalized item resolves first. [340.1]

    -

    Baited Hook kills the unit and adds its Deathknell as a pending item, then starts playing the chosen
    unit and adds it after the Deathknell. [808.1.d.2] [354.2]

    -

    The Deathknell finalizes first and waits on the chain.

    The chosen unit finalizes next and enters immediately, adding any abilities triggered by playing it
    above the Deathknell. [337.2] [359.2.c] [383.2.c] [383.3] [383.4.a.2]

    -

    The newer triggered abilities resolve first, followed by the older Deathknell.'
