- id: r-nocturne-horrifying-burn-and-minefield
  question: Can I banish and play Nocturne, Horrifying if Burn or Minefield puts it into my trash?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:440.1
  - core@1.4:135.2.b.6
  - core@1.4:369.1
  - core@1.4:370.1
  - core@1.4:108.2.d
  - core@1.4:424.1
  - core@1.4:424.2.a
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: other
  answer: 'Under the interpretation that a player looks at a card only when instructed to do so, no.

    Burn puts cards from the top of your main deck directly into your trash, [440.1] and Minefield gives
    the same instruction in its printed ability.

    Neither effect instructs you to look at or reveal Nocturne.

    Note (Rules citation needed):

    "Look" does not have a standalone numbered action definition in Core Rules 1.4.

    Unlike reveal, the rules do not expressly state that a player looks at cards only when instructed.

    This ruling relies on treating "look at" as an instructed event; an official definition is still needed.

    Nocturne''s replacement-effect condition, "As you look at or reveal me from the top of your deck,"
    does not itself instruct you to look at or reveal it. [135.2.b.6] [369.1]

    It can apply only while a qualifying look or reveal event is being processed. [370.1]

    In either case, Nocturne becomes public when it reaches the trash. [108.2.d]

    Under the same interpretation, becoming public does not mean you looked at it from the top of your
    deck.

    It also does not mean you revealed it from there because revealing a card is a specific game action
    performed when instructed. [424.1] [424.2.a]'
  cited_rule_history:
