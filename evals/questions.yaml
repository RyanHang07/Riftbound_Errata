- id: r-alpha-strike-illegal-friendly-target
  question: What if the chosen friendly unit leaves the board or becomes illegal before Alpha Strike resolves?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:359.3.f.1
  - core@1.4:359.3.f.2.a
  - core@1.4:359.3.e.2
  - core@1.4:359.3.e.3
  - core@1.4:359.3.e.4
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: other
  answer: 'Alpha Strike deals no damage if the chosen friendly unit is an illegal target when the spell
    resolves.

    An illegal friendly target provides no might that Alpha Strike can use for its damage instruction.
    [359.3.f.1] [359.3.f.2.a]

    Alpha Strike does not require the chosen friendly unit to be at a particular location, so moving between
    board locations does not by itself make it illegal. [359.3.e.2]

    If it stays on the board but temporarily stops being a unit or stops being friendly, it is legal again
    if it meets every targeting requirement at resolution. [359.3.e.3]

    If the target changes to or from a non-board zone, it remains illegal even if it returns before resolution
    because it is a new object. [359.3.e.4]'
  cited_rule_history:
