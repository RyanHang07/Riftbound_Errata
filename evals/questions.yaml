  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: other
  answer: 'Yes, if Applied Researchers is Empowered, you can play Shock Blast for [0].

    Applied Researchers itself satisfies Shock Blast''s requirement that you control something that is
    Empowered, so both cards'' discounts apply.

    Both abilities discount Shock Blast''s total cost during the Determine Total Cost step of playing
    it. [356.4]

    Discounts that apply to the total cost may be applied in any order. [356.4.d] [356.4.d.1]

    A minimum imposed by one discount applies only to that discount. [356.4.e]

    ### Cost Sequence [#cost-sequence]

    -

    **Base cost:** Shock Blast starts at [3]Mind.

    -

    **Applied Researchers reduction:** Reduce that cost by [1]Universal, leaving [2].

    -

    **Applied Researchers minimum:** The reduced cost remains above its minimum of [1].

    -

    **Shock Blast reduction:** Reduce the remaining energy cost by [2], leaving [0].

    Applying the discounts in the opposite order would leave the spell costing [1], but you may choose
    the order that results in the lower cost.'
