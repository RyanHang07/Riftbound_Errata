- id: r-irresistible-faefolk-combat-attacker
  question: If Irresistible Faefolk moves to an uncontested, uncontrolled battlefield outside a showdown
    and pulls an enemy unit there, who is the attacker?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:383.2.c
  - core@1.4:190.3.a.1
  - core@1.4:319.8
  - core@1.4:323.9
  - core@1.4:464.2.c.1
  - core@1.4:464.2.c.2
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: other
  answer: 'Irresistible Faefolk''s controller is the attacker.

    Irresistible Faefolk reaches the battlefield before its triggered ability can pull the enemy unit.
    [383.2.c]

    It contests that battlefield for its controller because no one controls it and it was not already
    contested. [190.3.a.1]

    Its ability then pulls the enemy unit there.

    With opposing units now at the contested battlefield, the next cleanup marks it for combat. [319.8]
    [323.9]

    When that combat begins, Irresistible Faefolk''s controller is the attacker and the pulled unit''s
    controller is the defender because Irresistible Faefolk was the unit that contested the battlefield.
    [464.2.c.1] [464.2.c.2]'
  cited_rule_history:
