- id: r-abilities-source-removal
  question: Does removing a triggered ability's source stop that ability?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:406.2
  - core@1.4:406.4
  - core@1.4:425.1
  - core@1.4:425.2.a
  - core@1.4:406.5
  - core@1.4:359.3.f.1
  - core@1.4:359.3.f.2
  - core@1.4:359.3.f.3
  - core@1.4:359.3.e.12
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: general-rules
  answer_short: 'no'
  answer: 'No.

    A triggered ability finalizes before opponents can react to it. [406.2] [406.4]

    Removing its source is not a counter instruction, so the ability remains on the chain and executes
    like a spell. [425.1] [425.2.a] [406.5]

    An instruction can still do nothing if it needs current information from the missing source.

    Source referents such as "here," "my," or "this battlefield" are normally checked when that instruction
    executes. [359.3.f.1] [359.3.f.2]

    Information referenced from a triggered ability''s trigger condition is instead recorded when the
    condition is fulfilled and remains available if the source later moves or leaves. [359.3.f.3]

    If an instruction instead needs the source''s current location and the source is no longer on the
    board, that information is unavailable, so the instruction cannot execute. [359.3.e.12]

    For example, if an opponent responds to Ashe, Focused''s play effect with Star-Crossed and returns
    Ashe to her owner''s hand, her ability still resolves because none of its instructions needs Ashe
    to remain on the board.

    By contrast, if Star-Crossed returns Vi, Peacekeeper before her attack trigger resolves, Vi cannot
    Stun an enemy unit "here" because she no longer has a location for "here" to reference.'
  cited_rule_history:
    '406.2': new-in-1.4
    '406.4': new-in-1.4
    '425.1': changed
    425.2.a: changed
    '406.5': stable
    359.3.f.1: stable
    359.3.f.2: stable
    359.3.f.3: stable
