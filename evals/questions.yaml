- id: r-targeting-illegal-targets
  question: What happens if a target becomes illegal before a spell or ability resolves?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:359.3.e.1
  - core@1.4:359.3.e.5
  - core@1.4:406.5
  - core@1.4:359.3.e.7
  - core@1.4:359.3.e.8
  - core@1.4:355.11.b
  - core@1.4:359.3.e.2
  - core@1.4:359.3.e.3
  - core@1.4:359.3.e.4
  - core@1.4:359.3.e.12
  - core@1.4:359.3.e.14.a
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: general-rules
  answer_short: other
  answer: 'The spell or ability still resolves, but the illegal target is unaffected, instructions related
    to it cannot be followed, and independent instructions continue normally. [359.3.e.1] [359.3.e.5]
    [406.5]

    If all of an instruction''s targets are illegal, that instruction does not execute. [359.3.e.7]

    If at least one target remains legal, the instruction executes using only the legal targets. [359.3.e.8]

    If a group of targets no longer collectively meets its targeting restriction, the spell or ability''s
    controller chooses a legal subset of the original targets for it to affect. [355.11.b]

    A target is illegal when the spell or ability resolves if it no longer meets the targeting requirements
    or has changed zones to or from a non-board zone. [359.3.e.2]

    A target that stops meeting a requirement and then meets it again is legal, but a target that changes
    to or from a non-board zone is a new object and remains illegal even if it returns. [359.3.e.3] [359.3.e.4]

    If an instruction needs information from the illegal target, that information is null and calculations
    using it are ignored. [359.3.e.12]

    If a later instruction is linked to an earlier instruction that was ignored, the later instruction
    is also ignored. [359.3.e.14.a]'
