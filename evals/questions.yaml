- id: r-elder-dragon-zero-target-finalization
  question: Does Elder Dragon's play effect finalize if its passive leaves no enemy units to target?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:355.13
  - core@1.4:383.3.a
  - core@1.4:402.4
  - core@1.4:406.2
  - core@1.4:319.6
  - core@1.4:334.2.a
  - core@1.4:383.4.a.2
  - core@1.4:142.4.c
  - core@1.4:323.5
  - core@1.4:320
  - core@1.4:323.6
  - core@1.4:323.7
  - core@1.4:330
  - core@1.4:331.1
  - core@1.4:406.4
  - core@1.4:811.6
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: 'yes'
  answer: 'Yes.

    The words "up to" allow Elder Dragon''s controller to choose zero targets. [355.13]

    Because the ability does not begin with "you may," its controller cannot decline to perform it, so
    the play effect finalizes even when no enemy units remain. [383.3.a] [402.4] [406.2]

    After Elder Dragon enters, its play effect is added to the chain before the resulting cleanup. [319.6]
    [334.2.a] [383.4.a.2]

    Elder Dragon''s passive ability makes its controller''s marked damage on enemy units lethal, so that
    cleanup may kill an opponent''s last units. [142.4.c] [323.5]

    The pending play effect remains on the chain throughout the cleanup, so the opponent retains control
    of their empty battlefields and their Hidden cards remain there. [320] [323.6] [323.7] [330] [331.1]

    After the play effect finalizes with zero targets, the opponent may play an eligible card from Hidden
    as a Reaction before the effect resolves. [406.4] [811.6]

    When the effect resolves with no targets, it simply does nothing.'
