  - core@1.4:402.2
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: other
  answer: 'After the spell resolves, Abandoned Hall can choose only a unit at Abandoned Hall controlled
    by the player who played that spell. [190.6.c] [355.9.b] [355.10]

    - **Moved into Abandoned Hall:** The unit can be chosen if the spell''s player controls the unit when
    Abandoned Hall''s triggered ability finalizes.

    - **Moved away from Abandoned Hall:** The unit cannot be chosen, even if the spell''s player controls
    the unit, because the unit is no longer at Abandoned Hall.

    Abandoned Hall''s trigger condition is not fulfilled until the spell has finished resolving. [419.4.a]

    The resulting ability is then added as a pending item. [383.3] [401.1]

    Abandoned Hall''s triggered ability chooses its target when the ability finalizes. [402.2]'
