    created: '2026-08-01'
    licence: CC BY-SA 4.0
- id: r-flow-abandon-destination
  question: Where does a Flow spell countered by Abandon go?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:369.1
  - core@1.4:425.1.a.1
  - core@1.4:829.1.b.1
  - core@1.4:372
  - core@1.4:370.2
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: mechanics
  answer_short: other
  answer: 'It is banished rather than returned to its owner''s hand.

    Abandon replaces putting the countered spell in the trash with returning it to its owner''s hand,
    [369.1] [425.1.a.1] while Flow replaces the spell leaving the chain with banishing it. [829.1.b.1]

    Because both replacement effects apply to the affected spell''s departure from the chain, that spell''s
    controller chooses their order. [372]

    The result is the same in either order.

    If Flow applies first, the spell is banished instead of going to the trash, so Abandon no longer has
    a qualifying event to replace.

    If Abandon applies first, it still replaces the original event with the spell leaving the chain for
    its owner''s hand, so Flow applies to that replacement event and banishes the spell instead. [370.2]'
  cited_rule_history:
    '369.1': changed
    425.1.a.1: new-in-1.4
    829.1.b.1: new-in-1.4
    '372': changed
    '370.2': stable
  source:
    url: https://github.com/ChristianIvicevic/riftboundfaq/blob/816d3b32d32a9966fc73367efb690fcbb4c195ca/content/(rulings)/mechanics/flow.mdx#abandon-destination
    authors:
    - Christian “Near” Ivicevic
    reviewed_core_rules: '1.4'
    created: '2026-08-01'
    licence: CC BY-SA 4.0
- id: r-repeat-repeat-decision-timing
  question: When do I decide whether to pay for Repeat?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:355.1.a
  - core@1.4:399
  - core@1.4:820.1.d
  - core@1.4:356.2.b.1
  - core@1.4:357
  - core@1.4:359.3.a
  - core@1.4:406.2
  - core@1.4:337.1.a
  - core@1.4:337.4
  - core@1.4:406.4
  - core@1.4:355.15
  - core@1.4:820.2
  - core@1.4:820.2.a
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: mechanics
  answer_short: other
  answer: 'Decide whether to pay Repeat as you play the spell or ability, before opponents can respond.

    -

    While making the relevant choices, choose whether to pay the Repeat cost. [355.1.a] [399] [820.1.d]

    -

    If you choose to pay it, include Repeat as an optional additional cost when determining the total
    cost. [356.2.b.1] [399] [820.1.d]

    -

    Pay the total cost and finish finalization. [357] [359.3.a] [406.2]

    Finalization does not pass priority, so opponents cannot respond during these steps. [337.1.a]

    -

    Once a Repeat spell or ability is finalized and no pending items remain, the normal response window
    opens. [337.4] [406.4]

    The Repeat decision is already locked in. [355.15]

    Note (Example):

    When playing Blood Rush, choose whether to pay its Repeat [1].

    If you pay, separately choose a target for each execution; both choices are locked in before you pay
    the spell''s cost. [820.2] [820.2.a]

    Include the extra [1] in the total cost and pay it before finalizing the spell.

    Only then can an opponent respond.'
  cited_rule_history:
