- id: r-astral-heron-trigger-timing
  question: When exactly does Astral Heron trigger, and which card gets its discount?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:419.4.a
  - core@1.4:419.4.a.1
  - core@1.4:383.3
  - core@1.4:406.5
  - core@1.4:390.4
  - core@1.4:419.1
  - core@1.4:356.4
  - core@1.4:357
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: other
  answer: 'Astral Heron triggers after your first card of the turn finishes resolving, and if its triggered
    ability resolves, it discounts the next card you play this turn after that resolution.

    In a trigger condition, "When you play" is checked only when the act of playing that card is completed
    by its resolution. [419.4.a]

    If a spell is countered instead of resolving, it does not trigger Astral Heron, and the first card
    you later resolve that turn can trigger it instead. [419.4.a.1]

    When the condition is fulfilled, the triggered ability is placed on the chain and must resolve before
    the discount exists. [383.3] [406.5] [390.4]

    Once it resolves, "the next card you play this turn" means the next card you place on the chain and
    queue for finalization. [419.1]

    Astral Heron''s discount is applied while determining that card''s total cost, before you pay the
    cost and finish finalizing it. [356.4] [357]'
