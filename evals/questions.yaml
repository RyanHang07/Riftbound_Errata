- id: r-ezreal-prodigy-optional-additional-costs
  question: Which costs does Ezreal reduce?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:356.2.b.1
  - core@1.4:805.1.a
  - core@1.4:820.1.d
  - core@1.4:356.4.c
  - core@1.4:356.4.d
  - core@1.4:356.2.a.1
  - core@1.4:158.1
  - core@1.4:204.2
  - core@1.4:205
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: other
  answer: 'Ezreal reduces only optional additional costs you choose to pay.

    These costs use both the word "may" and the exact phrase "as an additional cost." [356.2.b.1]

    Accelerate and Repeat are keyworded optional additional costs, so Ezreal reduces them too. [805.1.a]
    [820.1.d]

    Ezreal''s discount applies to the optional additional cost itself as soon as that cost is added, before
    discounts that apply to the card''s total cost. [356.4.c] [356.4.d]

    Mandatory additional costs are not optional because they omit "may," so Ezreal does not reduce them.
    [356.2.a.1]

    Hard Bargain''s resource payment happens while carrying out its effect as the spell resolves. [158.1]

    It is not an additional cost to play Hard Bargain, so Ezreal does not reduce it. [204.2] [205]

    Note (Example):

    Blast Corps Cadet says "You may pay [1]Fury as an additional cost to play me."

    Ezreal can reduce that optional additional cost to either [1] or Fury.

    By contrast, Ezreal does not reduce Cruel Patron''s mandatory cost to kill a friendly unit or the
    [2] an opponent may pay during Hard Bargain''s effect.

    Ezreal does reduce Hard Bargain''s separate Repeat cost.'
  cited_rule_history:
    356.2.b.1: stable
    805.1.a: changed
    820.1.d: changed
    356.4.c: stable
    356.4.d: stable
    356.2.a.1: stable
    '158.1': stable
    '204.2': new-in-1.4
    '205': new-in-1.4
  source:
