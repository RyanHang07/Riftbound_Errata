- id: r-heedless-resurrection-ignore-additional-costs
  question: Does Heedless Resurrection's "ignoring its cost" instruction also ignore the resurrected unit's
    additional costs, such as Accelerate?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:356.1.b.1
  - core@1.4:356.1.b.3
  - core@1.4:805.2
  - core@1.4:356.2.b.1
  - core@1.4:356.2.a.1
  version_dependent: null
  stale_text_exists: false
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: 'no'
  answer: 'No.

    "Ignoring its cost" only sets the resurrected unit''s base energy and power costs to zero; additional
    costs are not waived.

    When Heedless Resurrection instructs you to play a unit from the trash "ignoring its cost," that instruction
    sets the resurrected unit''s base energy cost and base power cost to zero. [356.1.b.1]

    Additional costs, such as the optional Accelerate cost, are applied in a separate step after the base
    cost is zeroed out and are unaffected by the instruction. [356.1.b.3] [805.2]

    If the resurrected unit has an optional additional cost you may choose whether to pay it; [356.2.b.1]
    if it has a mandatory additional cost you must pay it. [356.2.a.1]'
  cited_rule_history:
    356.1.b.1: stable
    356.1.b.3: stable
