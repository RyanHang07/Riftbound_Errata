- id: r-costs-and-payments-ignored-costs
  question: What costs still apply when I play a card ignoring one or more of its costs?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:355.1.a
  - core@1.4:356.1.b.3
  - core@1.4:356.2
  - core@1.4:356.3
  - core@1.4:356.1.b.2
  - core@1.4:356.1.b.1
  - core@1.4:356.5.a
  - core@1.4:356.7
  - core@1.4:356.4.f.1
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: general-rules
  answer_short: other
  answer: 'The exact phrase determines which costs remain.

    Mandatory additional costs, any optional additional costs you choose, and cost increases are included
    while determining the total in every case. [355.1.a] [356.1.b.3] [356.2] [356.3]

    - **"Ignoring its energy cost" or "ignoring its power cost":** Only the named base cost becomes zero;
    the other base cost still applies. [356.1.b.2]

    - **"Ignoring its cost":** Both the base energy cost and base power cost become zero. [356.1.b.1]

    - **"Ignoring any and all costs":** This phrase then sets the entire resulting total to zero. [356.5.a]

    This includes non-standard costs paid through game actions such as killing a unit. [356.7]

    A chosen optional additional cost counts as paid even though it adds nothing to the final total. [356.4.f.1]

    Note (Example):

    Fizz, Trickster sets the chosen spell''s base energy cost to [0].

    If an opponent controls Helm of Suppression, Helm''s cost increase is applied afterward, adding [1],
    or [1]Universal if Helm is Empowered.'
