- id: r-temporal-breach-mandatory-additional-cost
  question: What happens if a unit's owner can't pay a mandatory additional cost when Temporal Breach
    instructs them to play it?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:356.1.b.1
  - core@1.4:356.2.a.1
  - core@1.4:358.2
  - core@1.4:354
  - core@1.4:358.5
  version_dependent: null
  stale_text_exists: false
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: other
  answer: 'The attempted play is cancelled, and the unit returns to its owner''s banishment.

    Temporal Breach sets only the unit''s base energy and power costs to zero, so mandatory additional
    costs must still be paid. [356.1.b.1] [356.2.a.1]

    If the owner cannot pay one, the play fails its cost check. [358.2]

    The play is then cancelled and its actions are undone, returning the unit from the chain to its owner''s
    banishment without undoing Temporal Breach''s earlier, completed instruction. [354] [358.5]

    Note (Example):

    If Temporal Breach banishes Cruel Patron and its owner has no other friendly unit, they can''t pay
    Cruel Patron''s mandatory additional cost to kill a friendly unit.

    Cruel Patron cannot finish finalizing and returns to its owner''s banishment.'
  cited_rule_history:
    356.1.b.1: stable
    356.2.a.1: stable
