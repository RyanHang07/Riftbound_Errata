- id: r-hidden-blade-draw-if-not-killed
  question: If Hidden Blade's kill is prevented or replaced, does the target's controller draw?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:359.3.e.14
  - core@1.4:359.3.e.14.b
  - core@1.4:359.3.e.6
  - core@1.4:359.3.e.12.a
  - core@1.4:359.3.e.12
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling-faq
  category: cards
  answer_short: other
  answer: 'If the targeted unit remains on the board, its controller draws 2; if a replacement moves it
    off the board, no player draws.

    The phrase "its controller" links the draw to the unit affected by the preceding kill instruction.
    [359.3.e.14]

    If the legal target can''t be killed, the Vendetta FAQ classifies the kill instruction as negated
    rather than ignored, so the linked draw still executes.

    Replacing that kill does not itself stop the linked draw because the draw instruction does not refer
    to the kill action. [359.3.e.14.b]

    Note (Rules citation needed):

    Core Rules 1.4 still calls instructions prevented by other circumstances "ignored." [359.3.e.6]

    The linked Vendetta FAQ narrows that term to mistargeting and expressly takes precedence on this point
    until a later Core Rules Document says otherwise.

    - **The unit remains on the board:** Hidden Blade can identify its controller, and that player draws
    2. [359.3.e.12.a]

    For example, Zhonya''s Hourglass recalls the unit to base, where it remains on the board under its
    controller.

    - **The unit moves off the board:** Hidden Blade can no longer identify a controller for that card,
    so no player draws. [359.3.e.12]

    For example, a unit previously affected by Smite is banished instead when Hidden Blade would kill
    it.'
  cited_rule_history:
    359.3.e.14: new-in-1.4
    359.3.e.14.b: new-in-1.4
    359.3.e.6: new-in-1.4
    359.3.e.12.a: changed
    359.3.e.12: changed
  source:
    url: https://github.com/ChristianIvicevic/riftboundfaq/blob/816d3b32d32a9966fc73367efb690fcbb4c195ca/content/(rulings)/cards/hidden-blade.mdx#draw-if-not-killed
    authors:
    - Christian “Near” Ivicevic
    reviewed_core_rules: '1.4'
    created: '2026-01-22'
    licence: CC BY-SA 4.0
- id: r-hidden-blade-draw-if-illegal
  question: If Hidden Blade's target becomes illegal, does that target's controller draw?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:359.3.e.5
  - core@1.4:359.3.e.14
  - core@1.4:359.3.e.14.a
  version_dependent: null
  stale_text_exists: false
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: 'no'
  answer: 'No.

    An illegal target is unaffected by Hidden Blade, so the kill instruction is ignored. [359.3.e.5]

    Hidden Blade''s draw is linked to its kill instruction because "its controller" refers to the unit
    affected by that instruction. [359.3.e.14]

    When an earlier linked instruction is ignored, its later linked instructions are also ignored, so
    the controller does not draw. [359.3.e.14.a]

    Note (Example):

    You play Hidden Blade targeting an opponent''s unit at a battlefield.

    They respond by moving it to their base using Flash.

    Hidden Blade resolves.

    The unit is no longer at a battlefield, so it is an illegal target.

    The unit is not killed and the opponent does not draw.'
  cited_rule_history:
    359.3.e.5: new-in-1.4
    359.3.e.14: new-in-1.4
    359.3.e.14.a: new-in-1.4
