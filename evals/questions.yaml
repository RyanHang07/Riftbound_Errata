  stratum: expert-ruling
  category: cards
  answer_short: other
  answer: 'Yes, if the player who played the spell controls that unit when the ability finalizes.

    The spell starts playing the unit during its own resolution, so the unit waits on the chain as a pending
    item. [354.2] [354.3]

    When the spell finishes resolving, Abandoned Hall''s triggered ability is added as a newer pending
    item. [419.4.a] [383.3] [401.1]

    The unit finalizes before that newer ability because pending items finalize in append order. [337.1.b]

    It immediately resolves and enters Abandoned Hall. [337.2] [359.2.c]

    When the triggered ability later finalizes, it can select the unit played by the spell as its target.
