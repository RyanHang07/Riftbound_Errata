  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: mechanics
  answer_short: other
  answer: 'Equip and Quick-Draw count as you choosing a unit because they target that unit; Weaponmaster
    has you choose equipment, not the unit with Weaponmaster. [383.4.b.3]

    - Equip: You choose a unit you control as the ability''s target. [818.1.b] [818.1.b.1] [818.1.c.2]

    - Quick-Draw: Attaching does not inherently target, but the Quick-Draw ability mentions the unit it
