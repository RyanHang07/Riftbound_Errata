- id: r-khazix-mutating-horror-trigger-per-combat
  question: Can Kha'Zix, Mutating Horror trigger multiple times in the same turn?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:383.4.e
  - core@1.4:383.4.f
  - core@1.4:383.4.e.2.a
