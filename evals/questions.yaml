  answer: 'If "you may" begins the effect, choose during finalization; if it appears later, choose during
    resolution.

    - **Initial "you may":** Choose while the pending ability is being finalized. [383.3.a]

    If you decline, the ability is removed from the chain and considered not to have triggered. [383.3.a.2]

    If you proceed, make its required choices and pay any costs incurred during finalization before the
    ability becomes a finalized chain item. [402.2] [404.1] [406.2]

    For example, Tideturner begins its effect with "you may," so its controller decides whether to use
    the ability during finalization.

    - **Later "you may":** If another effect instruction comes first, make the optional choice when resolution
    reaches that later instruction. [383.3.a.3]

    For example, Ornn, Blacksmith first instructs its controller to look at cards, then says "You may
    reveal a gear," so that choice is made during resolution.'
  cited_rule_history:
