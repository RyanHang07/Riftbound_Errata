- id: r-lotus-trap-combat-assignment
  question: Does Lotus Trap affect how much damage needs to be assigned in combat?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:465.2.c.5
  - core@1.4:465.2.c.1
  - core@1.4:465.2.c.3
  - core@1.4:465.2.c.4.a
  - core@1.4:372
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: other
  answer: 'Yes, Lotus Trap''s doubling applies while combat damage is assigned, so the assigning player
    uses the doubled amount to determine lethal assignment.

    A replacement effect that would apply to the resulting damage is considered to apply to the assignment
    instead. [465.2.c.5]

    Assigning damage and dealing damage are still distinct steps. [465.2.c.1]

    A unit must have lethal damage assigned to it in full before any remaining damage may be assigned
    elsewhere, [465.2.c.3] so the doubling changes how much of the attacker''s damage the unit ties up.

    For an undamaged 3 might unit under Lotus Trap, the minimum is 2 damage: assigning 1 doubles to 2
    and is not lethal, while assigning 2 doubles to 4 and is lethal. [465.2.c.4.a]

    When that damage is dealt, it is not doubled again because the replacement was already applied during
    assignment. [465.2.c.5]

    If another damage replacement also applies, the unit''s controller chooses their order during assignment,
    which can change both the assigned and dealt amounts. [372] [465.2.c.5]'
  cited_rule_history:
