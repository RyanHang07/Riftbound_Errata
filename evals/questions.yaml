- id: r-bone-skewer-stun-targeting
  question: Does Bone Skewer stun a unit that can't be chosen by enemy spells or abilities?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:387.1
  - core@1.4:387.2
  - core@1.4:394.1
  - core@1.4:397
  - core@1.4:355.10.d
  - core@1.4:355.10.d.1
  - core@1.4:758
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: 'yes'
  answer: 'Yes.

    The reflexive trigger that stuns the unit does not ask its controller to choose anything.

    If the opponent plays the unit, Bone Skewer''s "then do this" wording creates a reflexive trigger.
    [387.1] [387.2]

    The trigger is linked to the preceding ability, and "it" can only refer to the unit played by that
    ability. [394.1] [397]

    The unit is therefore programmatically determined rather than chosen by the trigger''s controller,
    so it is not a target. [355.10.d] [355.10.d.1]

    Untargetability does not prevent the stun because it only prevents the unit from being a legal target.
    [758]'
