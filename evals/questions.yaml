- id: r-rebuttal-new-choices
  question: What choices can I remake when Rebuttal takes control of a spell?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:752
  - core@1.4:752.1
  - core@1.4:753
  - core@1.4:753.1
  version_dependent: null
  stale_text_exists: false
  provenance: mined
  stratum: expert-ruling-faq
  category: cards
  answer_short: other
  answer: 'Under the August 2026 Vendetta FAQ, you may either leave every target and mode unchanged or
    remake any subset.

    If you change nothing, existing choices may remain illegal.

    If you remake at least one choice, every resulting choice must be legal, including choices you left
    unchanged.

    Targets and modes are among the choices normally made during finalization. [752] [752.1]

    The Core Rules permit remaking any subset and prohibit illegal new choices, but they do not expressly
    address the unchanged choices. [753] [753.1]

    Note (Rules citation needed):

    Core Rules 1.4 does not independently supply the distinction between remaking at least one choice
    and leaving every choice unchanged.

    The cited FAQ notes that this Core Rules section will be revised in a future update.'
  cited_rule_history:
    '752': new-in-1.4
