- id: r-switcheroo-might-swap
  question: How does Switcheroo work?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:433.1
  - core@1.4:433.1.a
  - core@1.4:433.1.b
  - core@1.4:433.1.c
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: other
  answer: 'Switcheroo reverses the units'' current might when it resolves, but it does not exchange their
    base might or set either unit''s might to a new value.

    The Swap action determines the difference between the two current values, then creates a might increase
    for the lower value and an equal might decrease for the higher value. [433.1] [433.1.a] [433.1.b]

    Each increase or decrease lasts for Switcheroo''s stated duration, this turn. [433.1.a]

    If the units have equal might when Switcheroo resolves, the Swap has no effect. [433.1.c]'
  cited_rule_history:
    '433.1': stable
    433.1.a: changed
    433.1.b: changed
    433.1.c: stable
  source:
    url: https://github.com/ChristianIvicevic/riftboundfaq/blob/816d3b32d32a9966fc73367efb690fcbb4c195ca/content/(rulings)/cards/switcheroo.mdx#might-swap
    authors:
    - Christian “Near” Ivicevic
    reviewed_core_rules: '1.4'
    created: '2026-02-09'
    licence: CC BY-SA 4.0
- id: r-switcheroo-existing-modifiers
  question: Are existing equipment bonuses or passive effects counted again after Switcheroo resolves?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:476.1
  - core@1.4:477.3.a
  - core@1.4:477.3.d
  - core@1.4:433.1.a
  - core@1.4:433.1.b
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: other
  answer: 'No, each existing modifier is counted once as part of the unit''s current might, and it continues
    applying normally after Switcheroo resolves. [476.1] [477.3.a] [477.3.d]

    Switcheroo calculates one difference from the complete current values and creates separate increase
    and decrease effects; it does not remove, reapply, or replace the existing modifiers. [433.1.a] [433.1.b]

    For example, if a unit has 2 base might and an active +3 bonus, its current might is 5 for the Swap
    calculation.

    After the Swap, the +3 remains one part of that unit''s might rather than being added a second time.'
  cited_rule_history:
    '476.1': stable
    477.3.a: stable
    477.3.d: stable
    433.1.a: changed
    433.1.b: changed
  source:
    url: https://github.com/ChristianIvicevic/riftboundfaq/blob/816d3b32d32a9966fc73367efb690fcbb4c195ca/content/(rulings)/cards/switcheroo.mdx#existing-modifiers
    authors:
    - Christian “Near” Ivicevic
    reviewed_core_rules: '1.4'
    created: '2026-02-09'
    licence: CC BY-SA 4.0
- id: r-switcheroo-later-modifier-changes
  question: What happens when equipment detaches or passives stop applying after Switcheroo?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:476.3
  - core@1.4:477.3.a
  - core@1.4:433.1.a
  - core@1.4:433.1.b
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: other
  answer: 'Only the modifier that stops applying changes the unit''s might. [476.3] [477.3.a]

    Switcheroo''s increase or decrease keeps its originally calculated amount until end of turn.

    The Swap creates effects with fixed amounts when it resolves, so later changes do not cause it to
    recalculate the difference. [433.1.a] [433.1.b]

    Note (Example):

    Wuju Bladesman - Starter grants a friendly unit +2 might while it defends alone.

    Suppose your Pakaa Cub has 3 might before that bonus and defends alone, while an opposing Determined
    Sentry attacks with 1 might.

    The bonus from Wuju Bladesman raises Pakaa Cub to 5 current might.

    Your opponent plays Switcheroo targeting both units.

    Switcheroo gives Pakaa Cub -4 might and Determined Sentry +4 might, leaving them at 1 and 5 might
    respectively.

    If Pakaa Cub stops defending alone, it loses that +2 bonus but keeps Switcheroo''s -4 decrease, leaving
    it at -1 might.'
  cited_rule_history:
    '476.3': changed
    477.3.a: stable
    433.1.a: changed
    433.1.b: changed
  source:
    url: https://github.com/ChristianIvicevic/riftboundfaq/blob/816d3b32d32a9966fc73367efb690fcbb4c195ca/content/(rulings)/cards/switcheroo.mdx#later-modifier-changes
    authors:
    - Christian “Near” Ivicevic
    reviewed_core_rules: '1.4'
    created: '2026-02-09'
    licence: CC BY-SA 4.0
- id: r-switcheroo-negative-might
  question: Can Switcheroo result in negative might?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:433.1.a
  - core@1.4:433.1.b
  - core@1.4:476.3
  - core@1.4:143.2.b
  - core@1.4:143.2.b.1
  - core@1.4:142.4.b
  - core@1.4:323.5
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: other
  answer: 'Yes, a unit can have negative might if a bonus included in Switcheroo''s calculation stops
    applying while Switcheroo''s decrease remains. [433.1.a] [433.1.b] [476.3]

    Spells, abilities, and combat-damage assignment treat negative might as 0. [143.2.b]

    Might increases and decreases instead use the actual negative value. [143.2.b.1]

    The unit does not die merely for having 0 or negative might.

    At cleanup, it is killed only if it has a non-zero amount of marked damage equal to or greater than
    its might. [142.4.b] [323.5]

    Note (Example):

    A Scuttle Crab at -2 might is targeted with Punch First, which reads "Give a unit +5 Might this turn."

    Scuttle Crab ends up with 3 might because the +5 increase uses its actual -2 value.'
  cited_rule_history:
    433.1.a: changed
    433.1.b: changed
    '476.3': changed
    143.2.b: stable
    143.2.b.1: stable
    142.4.b: new-in-1.4
    '323.5': new-in-1.4
  source:
    url: https://github.com/ChristianIvicevic/riftboundfaq/blob/816d3b32d32a9966fc73367efb690fcbb4c195ca/content/(rulings)/cards/switcheroo.mdx#negative-might
    authors:
    - Christian “Near” Ivicevic
