- id: r-gangplank-naval-switcheroo-might-reduction
  question: What happens when Switcheroo would reduce an Empowered Gangplank, Naval's might?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:355.5
  - core@1.4:355.10
  - core@1.4:433.1.a
  - core@1.4:433.1.b
  - core@1.4:370.1
  - core@1.4:370.1.b
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling-faq
  category: cards
  answer_short: other
  answer: 'Under the August 2026 Vendetta FAQ, the might reduction is replaced with +3 might, while the
    modifier applied to the other unit is unchanged.

    Switcheroo chooses Gangplank when the spell is finalized. [355.5] [355.10]

    When it resolves, Switcheroo determines one difference and creates a separate increase and decrease.
    [433.1.a] [433.1.b]

    If the modifier affecting Gangplank would decrease his might, that event is replaced with +3 might
    because it comes from a spell that chose him.

    If it would increase his might, it does not match the events his ability replaces and applies normally.
    [370.1] [370.1.b]

    The modifier affecting the other unit is unchanged.

    Under that ruling, Switcheroo does not recalculate either fixed amount after Gangplank replaces his
    decrease.

    Note (Rules citation needed):

    Core Rules 1.4 does not yet make this no-recalculation result explicit, and its swap rules need clarification.

    Note (Example):

    An Empowered Gangplank with 6 current might is swapped with a Determined Sentry with 1 current might
    at the same battlefield via Switcheroo.

    The swap action calculates a difference of 5, then creates two modifiers: -5 might for Gangplank and
    +5 might for Determined Sentry.

    Gangplank''s replacement effect intercedes on his -5 might modifier because decreasing his might is
    one of the events it replaces, and turns it into +3 might instead.

    The +5 might modifier applies only to Determined Sentry, so Gangplank''s replacement effect does not
    affect it.

    Gangplank ends at 9 might (6 current might + 3 might); Determined Sentry ends at 6 might (1 current
    might + 5 might).'
  cited_rule_history:
    '355.5': stable
    '355.10': stable
    433.1.a: changed
    433.1.b: changed
    '370.1': stable
    370.1.b: stable
  source:
    url: https://github.com/ChristianIvicevic/riftboundfaq/blob/816d3b32d32a9966fc73367efb690fcbb4c195ca/content/(rulings)/cards/gangplank-naval.mdx#switcheroo-might-reduction
    authors:
    - Christian “Near” Ivicevic
    reviewed_core_rules: '1.4'
    created: '2026-07-12'
    licence: CC BY-SA 4.0
- id: r-glasc-mixologist-same-event-target
  question: Can Glasc Mixologist's Deathknell target a unit that died from the same event?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:402.2
  - core@1.4:428.2
  - core@1.4:186.1
  - core@1.4:323.4
  - core@1.4:323.5
  - core@1.4:334.2
  - core@1.4:370.1.a.2
  - core@1.4:808.1.d.2
  - core@1.4:158.3
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: other
  answer: 'Yes, if it is a non-token unit card in your trash that meets Glasc''s cost and rune restrictions.

    Glasc''s Deathknell chooses its target when the ability finalizes, not when the ability first becomes
    pending. [402.2]

    By then, every non-token unit killed by the same event has moved to its owner''s trash. [428.2]

    A killed token instead ceases to exist immediately after entering the trash, so it cannot be targeted.
    [186.1]

    During a cleanup, relevant death triggers from units with lethal damage become pending before those
    units move to the trash. [323.4] [323.5]

    Those pending abilities cannot be finalized until the cleanup is complete, so Glasc''s target is chosen
    only after the killed unit cards have moved to the trash. [334.2]

    When one effect instruction of a resolving spell or ability kills multiple units, their deaths are
    simultaneous. [370.1.a.2]

    Each relevant Deathknell becomes pending before its unit moves to the trash. [808.1.d.2]

    No pending ability can finalize until the current spell or ability finishes resolving. [158.3]'
  cited_rule_history:
    '402.2': changed
    '428.2': stable
    '186.1': changed
    '323.4': new-in-1.4
    '323.5': new-in-1.4
    '334.2': stable
    370.1.a.2: new-in-1.4
    808.1.d.2: changed
    '158.3': stable
  source:
    url: https://github.com/ChristianIvicevic/riftboundfaq/blob/816d3b32d32a9966fc73367efb690fcbb4c195ca/content/(rulings)/cards/glasc-mixologist.mdx#same-event-target
    authors:
