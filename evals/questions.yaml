- id: r-targeting-ignored-negated-instructions
  question: What is the difference between an ignored and a negated instruction?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:359.3.e.9
  - core@1.4:359.3.e.14.a
  - core@1.4:359.3.e.6
  version_dependent: null
  stale_text_exists: false
  provenance: mined
  stratum: expert-ruling-faq
  category: general-rules
  answer_short: other
  answer: 'An instruction is ignored only when it isn''t performed because its spell or ability mistargeted;
    an instruction whose effects are skipped, replaced, or prevented for another reason is negated under
    the August 2026 Vendetta Rules FAQ and Clarifications.

    Mistargeting means that a chosen target is illegal or unavailable when the instruction executes. [359.3.e.9]

    The distinction controls later linked instructions.

    If an earlier linked instruction is ignored, its later linked instructions are also ignored. [359.3.e.14.a]

    If an earlier linked instruction is negated, later linked instructions continue unless they specifically
    require the negated action to have occurred.

    Note (Rules citation needed):

    Core Rules 1.4 still calls instructions that fail because of circumstances other than mistargeting
    "ignored." [359.3.e.6]

    The Vendetta FAQ narrows that term to mistargeting and expressly takes precedence on this point until
    a later Core Rules Document says otherwise.

    Note (Example):

    If a unit chosen by Hidden Blade is at base when the spell resolves, Hidden Blade mistargets, so its
