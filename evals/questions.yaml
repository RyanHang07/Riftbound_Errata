    the kill instruction is performed.

    Targeting restrictions describe the target, as in "Kill a unit with 3 might or less." [355.9.b]

    In "Kill a unit if it has 3 might or less," the later "if" condition is instead part of the effect
    executed when the spell or ability resolves. [359.3.d] [406.5]'
