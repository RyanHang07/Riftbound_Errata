- id: r-promising-future-akshan-aurora
  question: When I choose Akshan, Mischievous with Promising Future, do I have to pay his additional cost
    before knowing whether I can take Dazzling Aurora?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:108.6.e
  - core@1.4:354.2
  - core@1.4:354.3
  - core@1.4:355.1.a
  - core@1.4:383.4.a.2
  - core@1.4:355.5
  - core@1.4:355.5.b
  - core@1.4:337.1
  - core@1.4:337.1.b
  - core@1.4:337.2
  - core@1.4:359.2.d
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: 'no'
  answer: 'No.

    Every player chooses and banishes a card before Promising Future instructs anyone to play one.

    Because cards in banishment are public information, [108.6.e] you, as Akshan, Mischievous''s controller,
    know whether your opponent chose Dazzling Aurora before deciding whether to pay Akshan''s additional
    cost.

    You can then choose Dazzling Aurora for Akshan''s play effect.

    Promising Future puts every chosen card on the chain as a pending item before any of them proceed
    to finalization. [354.2] [354.3]

    You decide whether to pay Akshan''s optional additional cost while Akshan is being finalized, not
    when he is banished or first put on the chain. [355.1.a]

    His play effect is a separate pending ability put on the chain after Akshan finalizes and enters the
    board. [383.4.a.2]

    You choose the enemy gear while that triggered ability is being finalized, rather than while Akshan
    is being finalized. [355.5] [355.5.b]

    This differs from a spell that chooses a gear itself, because that choice is made while the spell
    is finalized. [355.5]

    Akshan''s play effect is instead a separate, newer pending item, so every chosen card finalizes or
    leaves the chain before that ability finalizes. [337.1] [337.1.b] [383.4.a.2]

    ### Dazzling Aurora Is Banished First [#aurora-first-sequence]

    -

    The turn player banishes Dazzling Aurora.

    Because banished cards are public, you see that choice before selecting Akshan from your own top 5
    cards.

    -

    Starting with the next player, Akshan is put on the chain first and Dazzling Aurora second.

    -

    Akshan finalizes first.

    You already know Dazzling Aurora was selected and may choose to pay Akshan''s additional cost, even
    though Aurora is still pending. [355.1.a]

    -

    Akshan enters the board, and his play effect is put on the chain after Dazzling Aurora. [383.4.a.2]

    -

    Dazzling Aurora is the older pending item, so it finalizes next and enters the board before Akshan''s
    play effect is finalized. [337.1.b] [337.2] [359.2.d]

    -

    Akshan''s play effect then finalizes.

    Dazzling Aurora is now an enemy gear on the board, and you can choose it for that ability. [355.5]

    ### Akshan, Mischievous Is Banished First [#akshan-first]

    If Akshan is banished first, your opponent sees Akshan before choosing Dazzling Aurora.

    Dazzling Aurora is then put on the chain first and enters before Akshan is finalized.

    You therefore see Dazzling Aurora on the board when deciding whether to pay the additional cost.'
