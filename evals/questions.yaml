- id: r-temporal-breach-optional-additional-costs
  question: Can I pay optional additional costs, like Accelerate, when playing a unit banished by Temporal
    Breach?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:356.1.b.1
  - core@1.4:356.1.b.3
  - core@1.4:355.1.a
  - core@1.4:356.2.b.1
  - core@1.4:805.2
  version_dependent: null
  stale_text_exists: false
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: 'yes'
  answer: 'Yes.

    Playing the unit "ignoring its cost" sets only its base energy and power costs to zero. [356.1.b.1]

    Additional costs apply afterward and can raise the total cost above zero. [356.1.b.3]

    As the unit''s owner, you may therefore choose and pay an optional additional cost during finalization.
    [355.1.a] [356.2.b.1]

    For example, Accelerate remains available because it is an optional additional cost paid while playing
    the unit. [805.2]'
