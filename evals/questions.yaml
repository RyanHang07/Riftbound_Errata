- id: r-playing-cards-playing-from-trash
  question: When does a card leave my trash when I play it from there?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:354
  - core@1.4:354.2
  - core@1.4:358.5
  - core@1.4:369.3
  - core@1.4:356
  version_dependent: null
  stale_text_exists: false
  provenance: mined
  stratum: expert-ruling
  category: general-rules
  answer_short: other
  answer: 'It leaves your trash as soon as you begin playing it, although a failed legality check undoes
    that move and cancels the play.

    The first step of playing a card moves it from its current zone to the chain, where it waits to be
    finalized. [354] [354.2]

    If a legality check fails, the actions taken during the play process are undone. [358.5]

    While the play continues, the card is no longer in your trash when you make choices, determine its
    total cost, pay its costs, or finalize it.

    It also remains outside your trash while it resolves.

    For example, Shadow Assassin does not count itself for its "card with my name in your trash" condition;
    only another copy still in the trash counts. [369.3]

    Likewise, Rhasa the Sunderer does not include itself among the cards in your trash when determining
    its cost reduction. [356]'
