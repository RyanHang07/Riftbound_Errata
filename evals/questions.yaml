- id: r-aphelios-exalted-equipment-copy-effects
  question: How does Aphelios, Exalted interact with Svellsongur and Shady Spectacles?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:369.1
  - core@1.4:370.1.b.1
  - core@1.4:303.1
  - core@1.4:383.2.c
  - core@1.4:401.1
  - core@1.4:401.2
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling-faq
  category: cards
  answer_short: other
  answer: 'Aphelios triggers once when either Svellsongur or Shady Spectacles is attached to him, but
    another unit that becomes a copy of Aphelios through Shady Spectacles does not trigger.

    Note (Earlier Svellsongur ruling):

    The January 2026 Spiritforged FAQ ruled that Svellsongur copied Aphelios''s ability in time for both
    instances to trigger.

    The August 2026 Vendetta FAQ expressly reverses that ruling because the attachment happens before
    the copy action.

    Each "As this is attached" ability replaces the attachment event with that same event plus a separate
    copy action. [369.1] [370.1.b.1]

    Game actions are processed one at a time, so Aphelios''s trigger condition is checked after the attachment
    event and his ability is added to the chain before the copy action continues. [303.1] [383.2.c] [401.1]
    [401.2]

    With Svellsongur, that pending trigger is created before Svellsongur copies Aphelios''s effect text.

    The newly copied text does not look back and trigger from the attachment that already occurred, so
    there is no second trigger.

    With Shady Spectacles attached to Aphelios, his trigger is similarly created before he becomes a copy
    of the chosen unit.

    If Shady Spectacles is instead attached to another unit and that unit becomes a copy of Aphelios,
    the unit did not have Aphelios''s ability when the attachment event occurred, so it does not trigger
    at all.'
  cited_rule_history:
    '369.1': changed
    370.1.b.1: new-in-1.4
    '303.1': stable
    383.2.c: stable
    '401.1': stable
    '401.2': stable
  source:
    url: https://github.com/ChristianIvicevic/riftboundfaq/blob/816d3b32d32a9966fc73367efb690fcbb4c195ca/content/(rulings)/cards/aphelios-exalted.mdx#equipment-copy-effects
