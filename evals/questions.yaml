- id: r-fallen-feline-existing-spells
  question: Does Fallen Feline stop a named spell already on the chain?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:419.1
  - core@1.4:358.3.a
  version_dependent: null
  stale_text_exists: false
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: 'no'
  answer: 'No.

    A spell already on the chain has already started its play because playing a card means placing it
    there and queuing it for finalization. [419.1]

    While Fallen Feline is at a battlefield, it prevents opponents from starting another play of a spell
    with the chosen name, but it does not stop the spell already on the chain from finalizing or resolving.

    If that spell later instructs an opponent to play another spell with the chosen name, Fallen Feline
    can still make the new play impossible.

    Fallen Feline prevents that new play, so the second spell stays in its current zone while the spell
    already on the chain continues resolving. [358.3.a]'
  cited_rule_history:
    '419.1': stable
    358.3.a: new-in-1.4
  source:
    url: https://github.com/ChristianIvicevic/riftboundfaq/blob/816d3b32d32a9966fc73367efb690fcbb4c195ca/content/(rulings)/cards/fallen-feline.mdx#existing-spells
    authors:
    - Christian “Near” Ivicevic
    reviewed_core_rules: '1.4'
    created: '2026-08-01'
    licence: CC BY-SA 4.0
- id: r-fallen-feline-naming-timing
  question: When can I react to Fallen Feline's play effect?
  as_of: '2026-10-01'
  expect_sources:
