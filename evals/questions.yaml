- id: r-rebuttal-play-trigger-controller
  question: Whose "when you play a spell" abilities trigger for a spell Rebuttal takes control of?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:419.4.a
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling-faq
  category: cards
  answer_short: other
  answer: 'Under the August 2026 Vendetta FAQ, if the spell resolves after Rebuttal takes control of it,
    the spell''s new controller''s applicable "when you play a spell" abilities trigger; the original
    player''s abilities do not.

    These abilities trigger once the spell has finished resolving. [419.4.a]

    Rebuttal has made the player who gained control of the spell its controller by then.

    Note (Rules citation needed):

    Core Rules 1.4 establishes when "when you play" abilities trigger, but it does not independently establish
    responsibility for completing a spell''s play after its control changes.

    The outcome above follows the official FAQ ruling.

    Note (Example):

    Suppose you and your opponent each control Ravenbloom Student, and you use Rebuttal to gain control
    of your opponent''s Gust.

    Your Ravenbloom Student triggers when Rebuttal resolves under your control.

    If Gust then resolves under your control, your Ravenbloom Student triggers again, while your opponent''s
    Ravenbloom Student does not trigger for Gust.'
  cited_rule_history:
    419.4.a: changed
  source:
    url: https://github.com/ChristianIvicevic/riftboundfaq/blob/816d3b32d32a9966fc73367efb690fcbb4c195ca/content/(rulings)/cards/rebuttal.mdx#play-trigger-controller
