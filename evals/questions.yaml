  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: 'yes'
  answer: 'Yes.

    In each combat, Kha''Zix can trigger when he first attacks and when he first defends, if an enemy
    unit is alone at his battlefield at each check.

    Attack and defend trigger conditions are checked separately when a unit first gains the matching designation
    during a combat. [383.4.e] [383.4.f]

    Each matching check happens only once per combat, rather than once per turn. [383.4.e.2.a] [383.4.f.2.a]'
