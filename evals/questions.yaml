- id: r-flow-play-timing
  question: When can I play a spell using Flow?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:829.1.b
  - core@1.4:829.1.b.2
  version_dependent: null
  stale_text_exists: false
  provenance: mined
  stratum: expert-ruling
  category: mechanics
  answer_short: other
  answer: 'You can play it from your trash only when you otherwise have permission to play it at that
    timing.

    Flow lets you play the spell from your trash for its Flow cost, but it changes no other permissions
    or timing restrictions. [829.1.b] [829.1.b.2]

    For example, Flow does not grant a spell Reaction or let you play an Action outside its normal timing.'
  cited_rule_history:
    829.1.b: new-in-1.4
    829.1.b.2: new-in-1.4
  source:
    url: https://github.com/ChristianIvicevic/riftboundfaq/blob/816d3b32d32a9966fc73367efb690fcbb4c195ca/content/(rulings)/mechanics/flow.mdx#play-timing
    authors:
    - Christian “Near” Ivicevic
    reviewed_core_rules: '1.4'
    created: '2026-08-01'
    licence: CC BY-SA 4.0
- id: r-flow-countered-destination
  question: Where does a spell played using Flow go if it is countered?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:372
  - core@1.4:425.1.a
  - core@1.4:425.1.a.1
  - core@1.4:829.1.b.1
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: mechanics
  answer_short: other
  answer: 'It is banished unless another replacement effect changes that result. [372]

    Countering clears the spell from the chain and would normally put it in the trash. [425.1.a] [425.1.a.1]

    However, playing a spell using Flow creates a delayed replacement effect that banishes it if it would
    leave the chain after becoming finalized, unless its own execution instructed it to leave. [829.1.b.1]

    Being countered meets those conditions, so the Flow replacement effect banishes the spell instead
    of letting it go to the trash.'
  cited_rule_history:
    '372': changed
    425.1.a: stable
    425.1.a.1: new-in-1.4
    829.1.b.1: new-in-1.4
  source:
    url: https://github.com/ChristianIvicevic/riftboundfaq/blob/816d3b32d32a9966fc73367efb690fcbb4c195ca/content/(rulings)/mechanics/flow.mdx#countered-destination
    authors:
    - Christian “Near” Ivicevic
    reviewed_core_rules: '1.4'
    created: '2026-08-01'
    licence: CC BY-SA 4.0
- id: r-flow-printed-cost
  question: Can Defy counter a spell whose Flow cost exceeds Defy's limit?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:206
  - core@1.4:829.1.c.1
  version_dependent: null
  stale_text_exists: false
  provenance: mined
  stratum: expert-ruling
  category: mechanics
  answer_short: other
  answer: 'Yes, provided the spell''s printed or copied cost meets Defy''s restrictions.

    Defy checks the cost of its target, and effects that determine a card''s cost always use its printed
    or copied cost rather than the amount actually paid. [206]

    A Flow cost is an alternate cost that replaces the spell''s base cost during finalization, [829.1.c.1]
    but it does not change the printed or copied cost that Defy checks.'
  cited_rule_history:
    '206': new-in-1.4
    829.1.c.1: new-in-1.4
  source:
    url: https://github.com/ChristianIvicevic/riftboundfaq/blob/816d3b32d32a9966fc73367efb690fcbb4c195ca/content/(rulings)/mechanics/flow.mdx#printed-cost
    authors:
    - Christian “Near” Ivicevic
