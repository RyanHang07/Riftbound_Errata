  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: other
  answer: 'Yes, provided Applied Researchers is Empowered and the cost belongs to a spell.

    Its Empowered ability grants this discount only while it has the Empowered status. [828.1.b.1]

    Repeat is an optional additional cost. [820.1]

    Deflect imposes a mandatory additional cost on a spell or ability that targets the permanent with
    Deflect. [809.1.d]

    Discounts can reduce both kinds of additional costs, including to zero. [356.4.f]

    A Flow cost is an alternate cost that replaces a spell''s base cost during finalization. [829.1.c.1]

    Applied Researchers'' discount is applied afterward when determining the spell''s total cost. [356.1]
    [356.4]

    Because Applied Researchers'' discount applies only to spells, it cannot reduce a Repeat or Deflect
    cost paid while playing an ability. [820.1.a] [809.1.d]'
