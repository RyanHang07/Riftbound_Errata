  - core@1.4:358
  - core@1.4:358.5
  - core@1.4:359
  - core@1.4:359.2.c
  - core@1.4:359.2.d
  - core@1.4:337.1.a
  - core@1.4:337.2
  - core@1.4:359.3.a
  - core@1.4:337.4
  - core@1.4:339.1
  - core@1.4:340.1
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: general-rules
  answer_short: other
  answer: 'Playing a card moves through six play steps, then resolves according to its card category.

    -

    **Move the card to the chain.**

    It leaves its current zone and becomes a pending item waiting to be finalized. [354] [354.2]

    -

    **Make the relevant choices.**

    For a unit, choose the valid location where it will enter. [355.2]

    Also make any applicable mode, move destination, target, and optional-additional-cost choices. [355.1.a]
    [355.3] [355.4] [355.5]

    -

    **Determine the card''s total cost.** [356]

    -

    **Pay that cost.** [357]

    -

    **Check legality.**

    Check the card''s targets, costs, resulting game state, and timing permission. [358]

    If a check fails, undo the actions taken during the play process and cancel the play. [358.5]

    -

    **Finish finalizing the card.** [359]

    After finalization, resolution depends on the card category.

    A unit enters the board exhausted at its chosen location, while non-unit gear enters the board ready
    at its controller''s base. [359.2.c] [359.2.d]

    Both resolve immediately without passing priority. [337.1.a] [337.2]

    A spell instead becomes a finalized chain item. [359.3.a]

    It resolves only after no pending items remain and all players pass priority in sequence without adding
    another item. [337.4] [339.1] [340.1]'
