- id: r-showdowns-non-combat-showdown
  question: What happens if an opposing player's unit moves into an existing non-combat showdown?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:316.8.b.1.a
  - core@1.4:323.9
  - core@1.4:464.2.c.1
  - core@1.4:464.2.c.2
  - core@1.4:464.2.c.3
  - core@1.4:383.4.e
  - core@1.4:383.4.f
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: general-rules
  answer_short: other
  answer: 'When an opposing player''s unit becomes present during a non-combat showdown, combat is staged
    and the showdown becomes a combat showdown during the cleanup following that unit''s arrival. [316.8.b.1.a]
    [323.9]

    When combat opens, the player who began the non-combat showdown is the attacker, and the player whose
    unit joined is the defender. [464.2.c.1] [464.2.c.2]

    Both players and their units at that battlefield then gain the matching attacker or defender designation,
    identifying them as attacking or defending for that combat. [464.2.c.3]

    Eligible attack and defend triggers are checked when those designations are gained. [383.4.e] [383.4.f]'
