- id: r-promising-future-brynhir-thundersong
  question: Does Brynhir Thundersong stop an opponent's card chosen with Promising Future from being played?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:358.3.a
  - core@1.4:419.1
  - core@1.4:354.2
  - core@1.4:354.3
  - core@1.4:383.4.a.2
  version_dependent: null
  stale_text_exists: false
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: other
  answer: 'Only if Brynhir Thundersong''s play effect has already resolved when Promising Future instructs
    that opponent to play their chosen card.

    Brynhir then prevents that play, so the card remains banished. [358.3.a]

    Brynhir prevents an opponent from starting to play a card.

    A card''s play starts when it is placed on the chain; finalization and resolution happen later. [419.1]

    If Brynhir herself is chosen with Promising Future, she does not stop any other chosen card.

    Promising Future puts every chosen card on the chain as a pending item before any of them proceed
    to finalization. [354.2] [354.3]

    Brynhir''s play effect is added only after she finalizes and enters the board. [383.4.a.2]

    By then, every chosen card has already started being played, even if it has not yet finalized or resolved.'
