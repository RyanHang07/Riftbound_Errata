- id: r-diana-lunari-trigger-resolution-order
  question: Does Diana, Lunari's ability resolve before or after attack and defend abilities from the
    start of combat?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:383.4.e
  - core@1.4:383.4.f
  - core@1.4:464.2.b
  - core@1.4:464.2.c.3
  - core@1.4:334.1
  - core@1.4:334.2
  - core@1.4:464.2.a
  - core@1.4:464.2.e
  - core@1.4:340.1
  - core@1.4:464.1
  - core@1.4:464.2
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: other
  answer: 'When combat opens with a new showdown, Diana''s ability triggers first but resolves last, after
    all attack and defend abilities generated immediately afterward.

    Start-of-showdown effects happen before units gain their attacker and defender designations, so Diana
    triggers before those designations trigger attack and defend abilities. [383.4.e] [383.4.f] [464.2.b]
    [464.2.c.3]

    These are consecutive combat-opening tasks with no priority between them, so all resulting abilities
    are pending on the combat chain before any is finalized or can resolve. [334.1] [334.2] [464.2.a]
    [464.2.e]

    The newest chain items resolve first, so the attack and defend abilities resolve before Diana''s ability.
    [340.1]

    If combat opens during an existing showdown, the showdown does not begin again, so Diana''s "when
    a showdown begins here" ability does not trigger. [464.1] [464.2]'
  cited_rule_history:
    383.4.e: changed
