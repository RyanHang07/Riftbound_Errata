- id: r-temporal-breach-score-on-opponents-turn
  question: Can Temporal Breach make me conquer the same battlefield again on my opponent's turn?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:469.1
  - core@1.4:323.6
  - core@1.4:330
  - core@1.4:334.2
  - core@1.4:190.4.c
  - core@1.4:309.1
  - core@1.4:319.6
  - core@1.4:321.1
  - core@1.4:354
  - core@1.4:354.2
  - core@1.4:354.3
  - core@1.4:191.1
  - core@1.4:191.3
  - core@1.4:337.1
  - core@1.4:359.2.c
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: 'no'
  answer: 'No.

    You retain control of the battlefield while Temporal Breach banishes your only unit there and that
    unit is played again, so you do not conquer it again. [469.1]

    The unit remains pending on the chain through cleanup, so you do not lose and regain control of the
    battlefield. [323.6] [330] [334.2]

    Cleanup can remove your control of an empty battlefield only when no chain exists. [190.4.c] [309.1]

    ### Steps [#conquer-sequence]

    -

    Banishment leaves you with no units at the battlefield and incurs a cleanup, but that cleanup waits
    for Temporal Breach to finish resolving. [319.6] [321.1]

    -

    The unit''s owner begins playing it by moving it to the chain, where it remains pending while Temporal
    Breach finishes resolving. [354] [354.2] [354.3]

    -

    The pending unit remains on the chain throughout the cleanup, so you retain control.

    -

    The unit then finalizes and enters the same battlefield under its owner''s control. [191.1] [191.3]
    [334.2] [337.1] [359.2.c]'
