- id: r-baited-hook-illegal-target
  question: What happens if the targeted unit is removed before Baited Hook's ability resolves?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:359.3.e.2
  - core@1.4:359.3.e.5
  - core@1.4:359.3.e.12
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: other
  answer: 'The unit is not killed, you still look at the top 5 cards, but you cannot banish or play a
    unit from among them and must recycle every card you looked at.

    If the friendly unit is no longer a legal target when the ability resolves, it is unaffected and the
    kill instruction is ignored. [359.3.e.2] [359.3.e.5]

    Its might is then null, so the calculation used to choose a unit from the top 5 is ignored. [359.3.e.12]

    The independent instruction to recycle the rest still happens, and no card was banished, so every
    card you looked at is recycled. [359.3.e.5]'
