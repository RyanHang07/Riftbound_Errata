  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: mechanics
  answer_short: other
  answer: 'After the Ambush unit enters, ask whether anything remains on the chain.

    - **Nothing remains on the chain:** If the unit started the chain and no ability triggered by its
    entry remains, the chain closes and focus passes to the next player. [309.2] [347.1.b]

    - **Another item remains on the chain:** An ability triggered by the unit''s entry can finalize and
    remain. [383.2.c] [383.3] [406.2]

    An older item can remain if the unit was played in response to it. [337.2] [340.1]

    The newest remaining item''s controller gains priority, and focus does not pass. [309.1] [337.4] [340.4]'
