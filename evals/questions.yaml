- id: r-alpha-strike-might-reduction
  question: What if the friendly unit's might is reduced?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:359.3.f.1
  - core@1.4:359.3.f.2
  - core@1.4:355.14.f
  - core@1.4:355.14.g
  - core@1.4:355.14.h
  - core@1.4:355.14.h.1
  - core@1.4:143.2.b
  version_dependent: null
  stale_text_exists: false
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: other
  answer: 'If the friendly target remains legal but has lower might when Alpha Strike resolves, Alpha
    Strike uses that reduced might as the amount of damage to split. [359.3.f.1] [359.3.f.2]

    If there is not enough damage to assign at least 1 to every enemy target, Alpha Strike''s controller
    must remove exactly enough enemy units from Alpha Strike''s targets and cannot remove extras to concentrate
    the damage. [355.14.f] [355.14.g] [355.14.h] [355.14.h.1]

    Note (Example):

    You chose a friendly Pakaa Cub with 3 might, then chose 3 enemy units.

    Before Alpha Strike resolves, an opponent plays Stupefy targeting Pakaa Cub, reducing its might to
    2.

    You must choose exactly 1 enemy unit to cease being a target.

    You cannot drop a second target to deal both points of damage to one unit.

    A might below 0 counts as 0 when Alpha Strike references it. [143.2.b]

    If Alpha Strike has 0 damage to split, every enemy target ceases being a target because each remaining
    target would have to receive at least 1 damage. [355.14.f] [355.14.g] [355.14.h]'
