- id: r-abandoned-hall-countered-spell
  question: Does Abandoned Hall's ability trigger if the spell is countered?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:419.4.a
  - core@1.4:419.4.a.1
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: 'no'
  answer: 'No.

    Abandoned Hall''s "when a player plays a spell" condition is fulfilled only when that spell finishes
    resolving. [419.4.a]

    A countered spell does not resolve and is not considered played for triggered abilities, so Abandoned
    Hall''s ability is not put on the chain. [419.4.a.1]'
