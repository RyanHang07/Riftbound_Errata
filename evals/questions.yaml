- id: r-baron-nashor-baron-pit-showdown
  question: What happens after Baron Nashor enters the Baron Pit?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:439.4.b
  - core@1.4:190.3.a.1
  - core@1.4:319.6
  - core@1.4:316.8.b
  - core@1.4:323.12
  - core@1.4:190.4.b
  - core@1.4:347.2.a
  - core@1.4:348
  - core@1.4:348.2.a
  - core@1.4:348.2.a.1
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: other
  answer: 'Baron Nashor''s entry contests the newly created Baron Pit and leads to a non-combat showdown
    there.

    The Baron Pit remains uncontrolled until that showdown closes.

    ### Entry and Showdown Opening [#showdown-opening-sequence]

    -

    The Baron Pit is created uncontrolled. [439.4.b]

    -

    Baron Nashor enters it and contests it for his controller. [190.3.a.1]

    -

    His entry causes a cleanup, which stages a showdown at the Baron Pit. [319.6] [316.8.b]

    -

    That showdown normally begins during the cleanup.

    If multiple showdowns are ready to begin, the turn player chooses which one begins. [323.12]

    -

    The Baron Pit remains uncontrolled while the showdown is ongoing. [190.4.b]

    ### Closing and Conquest [#closing-conquest]

    The showdown closes after every player passes focus in sequence without playing a spell or activating
    an ability. [347.2.a] [348]

    If Baron Nashor''s controller is then the only player with units there, they establish control of
    the Baron Pit and conquer it if they have not scored it that turn. [348.2.a] [348.2.a.1]'
