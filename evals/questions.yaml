- id: r-thrill-of-the-hunt-score-on-opponents-turn
  question: If I own and control a unit at a battlefield I control, can Thrill of the Hunt make me conquer
    that battlefield again on my opponent's turn?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:330
  - core@1.4:354.4
  - core@1.4:309.1
  - core@1.4:323.6
  - core@1.4:469.1
  - core@1.4:319.6
  - core@1.4:321.1
  - core@1.4:354.2
  - core@1.4:354.3
  - core@1.4:334.2
  - core@1.4:337.1
  - core@1.4:359.2.c
  version_dependent: null
  stale_text_exists: false
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: 'no'
  answer: 'No.

    Thrill of the Hunt instructs the banished unit''s owner to play it to any battlefield.

    Because you own the unit in this scenario, you choose that battlefield.

    If you choose the original battlefield, the unit remains on the chain throughout cleanup while being
    played again, so you keep control until it returns. [330] [354.4] [309.1] [323.6]

    Because you do not gain control again, you do not conquer the battlefield again. [469.1]

    The following sequence applies when you choose the original battlefield.

    -

    **Unit becomes pending:** Thrill of the Hunt banishes the unit and instructs you, as its owner, to
    play it before the resulting cleanup runs. [319.6] [321.1]

    The unit moves to the chain as a pending item while Thrill of the Hunt finishes resolving. [354.2]
    [354.3]

    -

    **Cleanup:** The pending unit keeps the chain in progress while cleanup runs, so cleanup does not
    remove your battlefield control.

    -

    **Unit enters:** After cleanup, the unit finalizes and enters the same battlefield. [334.2] [337.1]
    [359.2.c]'
