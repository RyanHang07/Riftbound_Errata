- id: r-baited-hook-kill-reaction-window
  question: Can my opponent react before Baited Hook kills my unit?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:377.1
  - core@1.4:355.10
  - core@1.4:402.2
  - core@1.4:406.4
  - core@1.4:359.3.e.14
  - core@1.4:359.3.e.13
  - core@1.4:340.1
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: cards
  answer_short: 'yes'
  answer: 'Yes.

    "Kill a friendly unit" comes after the ":" in Baited Hook''s activated ability, so it is an effect
    instruction rather than part of the activation cost. [377.1]

    That instruction targets a friendly unit, and you choose that target while the ability is being finalized.
    [355.10] [402.2]

    After Baited Hook''s ability is finalized, opponents have an opportunity to play Reactions before
    it resolves and kills the target. [406.4]

    The later might limit refers to the unit affected by the kill, so these are linked instructions. [359.3.e.14]

    After the unit enters the trash, Baited Hook uses its might from immediately before that zone change.
    [359.3.e.13]

    Note (Example):

    You activate Baited Hook, targeting a friendly unit with 4 might.

    In response, your opponent plays Stupefy, reducing that unit''s might by 1 down to 3.

    As the newer chain item, Stupefy resolves first, so the unit has 3 might when Baited Hook kills it.
    [340.1]

    Baited Hook therefore lets you banish a unit with up to 4 might from among the top 5 cards of your
    main deck.'
