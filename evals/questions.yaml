- id: r-abilities-costs-within-instructions
  question: When do I pay costs in a triggered ability?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:740.4.a
  - core@1.4:383.3.b
  - core@1.4:383.3.b.1
  - core@1.4:740.4.a.2
  - core@1.4:740.4.a.2.a
  - core@1.4:404.2
  - core@1.4:406.5
  - core@1.4:406.4
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: general-rules
  answer_short: other
  answer: 'The "[do X] to [do Y]" form creates a cost within instructions: [do X] is the cost and [do
    Y] is its effect. [740.4.a]

    Pay [do X] during finalization if it begins the triggered effect or immediately follows an initial
    "you may." [383.3.b] [383.3.b.1] [740.4.a.2]

    Pay it during resolution if it appears later. [740.4.a.2.a]

    If that cost is due during finalization and you decline to pay it, the pending ability is removed
    from the chain without finalizing. [404.2]

    The "[do X]. If you do, [do Y]" form does not create a cost within instructions.

    The [do X] instruction is executed during resolution. [406.5]

    For example, Vayne, Hunter says "When I conquer, you may pay [1] to return me to my owner''s hand."

    The "pay [1] to return me" form creates a cost within instructions immediately after the initial "you
    may," so you pay it during finalization.

    If you pay, the ability finalizes and opponents may react before it resolves. [406.4]

    By contrast, Insightful Investigator first has an opponent reveal their hand and only then offers
    a payment, so that cost within instructions appears later and you pay it during resolution.'
  cited_rule_history:
    740.4.a: stable
    383.3.b: new-in-1.4
    383.3.b.1: stable
    740.4.a.2: changed
    740.4.a.2.a: new-in-1.4
