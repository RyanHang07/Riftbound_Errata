- id: r-repeat-repeated-instructions
  question: What does Repeat repeat?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:820.1.d.1
  - core@1.4:820.3.a
  - core@1.4:820.1.d.2
  - core@1.4:820.1.c.1
  - core@1.4:820.1.c.3
  - core@1.4:820.2
  - core@1.4:820.2.a
  version_dependent: null
  stale_text_exists: true
  provenance: mined
  stratum: expert-ruling
  category: mechanics
  answer_short: other
  answer: 'Repeat executes a spell or ability''s instructions an additional time during the same resolution;
    it does not create another copy or chain item. [820.1.d.1] [820.3.a]

    Instructions handled outside resolution are not repeated. [820.1.d.2]

    The spell or ability is played only once, so you determine and pay its play costs, including the Repeat
    cost, only once. [820.1.c.1] [820.1.c.3] [820.3.a]

    You choose targets and modes and make other choices separately for each execution. [820.2] [820.2.a]

    You may make different choices for the original and additional executions.'
  cited_rule_history:
    820.1.d.1: new-in-1.4
    820.3.a: new-in-1.4
    820.1.d.2: new-in-1.4
    820.1.c.1: changed
    820.1.c.3: stable
    '820.2': changed
    820.2.a: stable
  source:
    url: https://github.com/ChristianIvicevic/riftboundfaq/blob/816d3b32d32a9966fc73367efb690fcbb4c195ca/content/(rulings)/mechanics/repeat.mdx#repeated-instructions
    authors:
    - Christian “Near” Ivicevic
    reviewed_core_rules: '1.4'
