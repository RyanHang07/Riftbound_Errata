- id: r-costs-and-payments-total-cost-determination
  question: How is a card's total cost determined?
  as_of: '2026-10-01'
  expect_sources:
  - core@1.4:356.1
  - core@1.4:356.2
  - core@1.4:356.3
  - core@1.4:356.4
  - core@1.4:356.5
  - core@1.4:356.4.d
  - core@1.4:356.4.c.1
  - core@1.4:356.4.d.1
  - core@1.4:356.4.e
  version_dependent: null
  stale_text_exists: false
  provenance: mined
  stratum: expert-ruling
  category: general-rules
  answer_short: other
  answer: 'A card''s total cost is determined in five stages, in this order:

    -

    Start with the card''s base costs, replacing them or setting them to zero as instructed. [356.1]

    -

    Add all mandatory additional costs and any optional additional costs you chose to pay. [356.2]

    -

    Add all applicable cost increases. [356.3]

    -

    Reduce the card''s cost by all applicable discounts. [356.4]

    -

    Apply any effects that modify the resulting total cost. [356.5]

    Discounts that apply to one specific part of a cost are applied before discounts that apply to the
    total cost. [356.4.d]

    If multiple discounts apply within either group, you may choose their order. [356.4.c.1] [356.4.d.1]

    Any minimum imposed by a discount applies only to that discount, so a later discount can reduce the
    cost further. [356.4.e]'
  cited_rule_history:
    '356.1': stable
    '356.2': stable
    '356.3': stable
    '356.4': stable
