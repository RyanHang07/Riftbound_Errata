[project]
name = "rb_errata"
version = "0.0.0"
description = "Version-aware rules retrieval for Riftbound TCG, answered as of a date"
readme = "README.md"
# Pinned to one minor version: the brief fixes 3.12, and a floating ">=3.12"
# lets a contributor on 3.14 produce results nobody else can reproduce.
requires-python = ">=3.12,<3.13"
dependencies = [
    # psycopg 3: first-party typed Postgres driver. pgvector values are sent
    # as text literals in slice 0, so the pgvector adapter is not needed yet.
    "psycopg[binary]>=3.2,<4",
    # Raw HTTP to Ollama instead of the `ollama` client package: we must set
    # `think`, `truncate`, `num_ctx` and `seed` explicitly, and a client
    # library that changes its defaults between releases would change every
    # generation without a code diff here. uv.lock pins exact versions.
    "httpx>=0.27,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
rb-errata = "rb_errata.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rb_errata"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["rb_errata", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
